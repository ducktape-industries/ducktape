# The supply-chain tripwire. `make audit` runs `cargo deny check advisories`
# against the committed Cargo.lock: RustSec vulnerability / unsound /
# unmaintained advisories, plus yanked crates.
#
# ONLY the advisories check is wired up. `licenses` would need an allowlist
# nobody has asked for, and `bans`/`sources` police duplicate versions and
# registries, which this workspace has no policy on — a check that fires on
# things nobody intends to act on is a check people learn to skip.
#
# Every entry below is an advisory this workspace cannot take the upgrade for
# today, and says what would clear it. Adding an entry here is a decision to
# carry a known defect — write the reason for the person who reads it next.
#
[advisories]
# A yanked crate is a maintainer saying "do not use this build". The lock is
# the artifact everything ships from, so it fails the gate rather than warning.
yanked = "deny"

ignore = [
  # ── unmaintained crates nothing here depends on directly ────────────────
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, under commonware-codec. Cleared when commonware-codec drops paste." },
]
