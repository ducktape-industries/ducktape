# forge-sync on fabrics-1: its namespace, a Service onto duckpond's node, its state claim, a policy closing every inbound port, and the follower Deployment.
# Applied by ops/k8s/forge-sync/deploy, which substitutes @IMAGE@; the follower signs #sync posts with the Secret duckpond-key and pushes to GitHub as the App in the Secret github-app.
apiVersion: v1
kind: Namespace
metadata:
  name: forge-sync
---
apiVersion: v1
kind: Service
metadata:
  name: forge-sync-node
  namespace: duckpond
  labels:
    app.kubernetes.io/part-of: forge-sync
spec:
  type: ClusterIP
  selector:
    app: node
  ports:
    - name: http
      port: 8844
      targetPort: 8844
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-sync
  namespace: forge-sync
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-ingress
  namespace: forge-sync
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-sync
  namespace: forge-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forge-sync
  template:
    metadata:
      labels:
        app: forge-sync
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: follower
          image: "@IMAGE@"
          env:
            - name: FORGE_SYNC_NODE
              value: http://forge-sync-node.duckpond.svc.cluster.local:8844
            - name: FORGE_SYNC_CHAIN
              value: duckpond-725bcad1
            - name: FORGE_SYNC_CHANNEL
              value: sync
            - name: FORGE_SYNC_STATE
              value: /state
            - name: FORGE_SYNC_REPOS
              value: core=ducktape-industries/ducktape programs=ducktape-industries/programs app=ducktape-industries/app
            - name: FORGE_SYNC_BRANCHES
              value: dev main
            - name: FORGE_SYNC_KEYS
              value: /keys/duckpond
            - name: FORGE_SYNC_APP
              value: /keys/github-app
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            - name: duckpond-key
              mountPath: /keys/duckpond
              readOnly: true
            - name: github-app
              mountPath: /keys/github-app
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: forge-sync
        - name: tmp
          emptyDir: {}
        - name: duckpond-key
          secret:
            secretName: duckpond-key
            defaultMode: 0440
        - name: github-app
          secret:
            secretName: github-app
            defaultMode: 0440
