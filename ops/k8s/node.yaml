# The network's node: ducktape on its home, and the Service node-http that carries its HTTP port inside the cluster.
# Applied by ops/k8s/deploy, which substitutes NETWORK and IMAGE, and with HOST set binds both ports on that host address.
apiVersion: v1
kind: Service
metadata:
  name: node-http
  namespace: NETWORK
spec:
  selector:
    app: node
  ports:
    - {name: http, port: 8844, targetPort: 8844}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node
  namespace: NETWORK
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      priorityClassName: system-node-critical
      hostUsers: false
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
        options:
          - {name: ndots, value: "1"}
      containers:
        - name: node
          image: IMAGE
          ports:
            - {name: http, containerPort: 8844}
            - {name: halo, containerPort: 9100, protocol: UDP}
          envFrom:
            - secretRef: {name: egress, optional: true}
          resources:
            requests: {cpu: "8", memory: 2Gi}
          volumeMounts:
            - {name: home, mountPath: /data}
            - {name: egress, mountPath: /secrets/egress, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
        - name: egress
          secret: {secretName: egress, optional: true}
