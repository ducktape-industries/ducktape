# The network's node: ducktape on its home, and the Service node-http that carries its HTTP port inside the cluster.
# Applied by ops/k8s/deploy, which substitutes NETWORK and IMAGE.
apiVersion: v1
kind: Service
metadata:
  name: node-http
  namespace: NETWORK
spec:
  selector:
    app: node
  ports:
    - {name: http, port: 8844, targetPort: 8844}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node
  namespace: NETWORK
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      priorityClassName: system-node-critical
      hostUsers: false
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
        options:
          - {name: ndots, value: "1"}
      containers:
        - name: node
          image: IMAGE
          resources:
            requests: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - {name: home, mountPath: /data}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
