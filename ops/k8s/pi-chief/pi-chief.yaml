# pi-chief on fabrics-1: its namespace and service account, the Role it holds in duckpond, its state claim, a policy closing every inbound port, and its Deployment.
# Applied by ops/k8s/pi-chief/deploy, which substitutes @IMAGE@, @MODE@, @ACCOUNT@ and @ANCHOR_WINDOW@; it signs with the key in the Secret `key`.
apiVersion: v1
kind: Namespace
metadata:
  name: pi-chief
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-chief
  namespace: pi-chief
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pi-chief
  namespace: duckpond
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [node]
    verbs: [get, watch, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pi-chief
  namespace: duckpond
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pi-chief
subjects:
  - kind: ServiceAccount
    name: pi-chief
    namespace: pi-chief
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: state
  namespace: pi-chief
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: "1"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-ingress
  namespace: pi-chief
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-chief
  namespace: pi-chief
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pi-chief
  template:
    metadata:
      labels:
        app: pi-chief
    spec:
      serviceAccountName: pi-chief
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-chief
          image: "@IMAGE@"
          env:
            - {name: PI_CHIEF_MODE, value: "@MODE@"}
            - {name: PI_CHIEF_ACCOUNT, value: "@ACCOUNT@"}
            - {name: PI_CHIEF_REPORT_TO, value: "15 17"}
            - {name: PI_CHIEF_HANDS_OFF, value: "18"}
            - {name: PI_CHIEF_ANCHOR_WINDOW, value: "@ANCHOR_WINDOW@"}
            - {name: PI_CHIEF_NODE, value: http://node-http.duckpond.svc:8844}
            - {name: PI_CHIEF_NAMESPACE, value: duckpond}
            - {name: PI_CHIEF_DEPLOYMENT, value: node}
            - {name: PI_CHIEF_CONTAINER, value: node}
            - {name: PI_CHIEF_STATE, value: /state}
            - {name: PI_CHIEF_KEYS, value: /keys}
            - {name: PI_CHIEF_WORKSPACE, value: /tmp/ducktape}
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: state
        - name: keys
          secret:
            secretName: key
        - name: tmp
          emptyDir: {}
