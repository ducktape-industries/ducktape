# A network's namespace and the volume its node's home lives on, kept when the claim is deleted.
# Applied by ops/k8s/deploy, which substitutes NETWORK.
apiVersion: v1
kind: Namespace
metadata:
  name: NETWORK
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home
  namespace: NETWORK
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 50Gi
