# The network's Cloudflare tunnel: cloudflared carrying the Service node-http, and the WebSocket on it that peers dial, to the address on chain.
# Applied by ops/k8s/deploy, which substitutes NETWORK; the tunnel's token is the Secret `tunnel`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  namespace: NETWORK
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel
  template:
    metadata:
      labels:
        app: tunnel
    spec:
      priorityClassName: system-cluster-critical
      hostUsers: false
      containers:
        - name: tunnel
          image: docker.io/cloudflare/cloudflared:2026.10.0
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", --url, "http://node-http.NETWORK.svc.cluster.local:8844", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: tunnel, key: token}
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
