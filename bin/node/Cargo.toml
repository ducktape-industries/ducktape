[package]
name = "node-bin"
edition.workspace = true
version.workspace = true

# `--cfg tokio_unstable` (set workspace-wide in .cargo/config.toml, for the
# SIGUSR1 task dump) is a real, deliberately-set cfg, not a typo.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(tokio_unstable)"] }

# a runnable multi-process node: derives an ed25519 identity from a config seed,
# stands up a real `authenticated::discovery` encrypted TCP mesh to its peers,
# runs a live simplex Engine (via consensus::SimplexOrderer, over the REAL tokio
# runtime + discovery channels — NOT p2p::simulated) driving an OrderedNode over
# host::Host, and prints its evolving root-hash so a demo script can assert two
# OS processes converge over real sockets.
[[bin]]
name = "ducktape"
path = "src/main.rs"

[dependencies]
module-artifact = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
# terminal styling for the operator verbs. Both already ride in on clap's own
# dependency graph, so promoting them to direct deps adds no supply chain:
# `anstyle` is the (escape-free) style vocabulary and `anstream` is the stream
# wrapper that STRIPS those escapes when the destination is not a terminal or
# NO_COLOR is set — which is where non-tty correctness is enforced, once,
# instead of in every renderer.
anstyle = "1.0"
anstream = "1.0"
host = { workspace = true }
# the module composition catalog this composer draws its genesis selection from.
topology = { workspace = true }
node = { workspace = true }
consensus = { workspace = true }
recovery = { workspace = true }
sdk = { workspace = true }
statesync = { workspace = true }
# the production module set: system infrastructure + every product module.
# (acl composes as a wasm tenant: its component rides in the genesis, and the
# crate is linked only for its native types.)
valset = { workspace = true }
governance = { workspace = true }
# the resident-accept verb drives governance ops through the local rpc.
# the network module-code registry. Height-gated live code swaps are realized
# through the blobstore-backed CodeSource.
modules = { workspace = true }
wasm-host = { workspace = true }
saga = { workspace = true }
# the network-wide node-capability registry + its wire surface; the host-side
# provider discovery announces this node's installed executor CLIs into it.
capability = { workspace = true }
provider-host = { workspace = true }
# the agent tool plane's catalog. `ducktape mcp` is its stdio transport; the
# compute daemon serves the SAME `handle` over each run's node lane.
mcp-host = { workspace = true }
# the task plane: recipe manifests + capability dispatch + its host worker.
dispatch = { workspace = true }
attribution = { workspace = true }
agent-service = { workspace = true }
compute-service = { workspace = true }
forge = { workspace = true }
pages = { workspace = true }
chat = { workspace = true }
# the huddle media planes the voice hub runs: Opus engine, video wire, call-socket framing.
tasks = { workspace = true }
# `ducktape collab` constructs the module's own ops, so a shape change is a
# compile error here rather than a hand-rolled json payload that drifts.
collaboration = { workspace = true }
identity = { workspace = true }
# the passkey enrollment challenge — the same bytes `KeyScheme::Secp256r1` verifies.
keyscheme = { workspace = true }
# the desktop app's release manifest + signature: `ducktape release sign`.
app-update = { workspace = true }
authpage = { workspace = true }
gateway = { workspace = true }
# the airlock contract: `server` supplies the GrantCheck type the lender daemon
# injects (src/airlock.rs); `client` is the enclave-facing credential machinery
# (session token handshake). Real quote verification (`user cred inspect|seal`,
# src/cred_seal.rs — those fetch a quote and verify it against roots they
# resolve themselves, so the node is uninvolved) is the opt-in `verify`
# feature below, off by default.
airlock = { path = "../../crates/airlock", features = ["client", "server"] }
# the lender's disk-backed credential store: opened by the `service run airlock`
# daemon, and written by `user cred add`.
airlock-service = { workspace = true }
files = { workspace = true }
# duckfs reusable core and disk scratch helpers; the `files` crate above remains
# the consensus module adapter.
duckfs-core = { workspace = true }
# the `ducktape fs` verb family drives the checkout/commit engine + HttpNode.
duckfs-client = { workspace = true }
duckfs-disk = { workspace = true }
# NFC-normalizes a typed `fs` path argument at the CLI boundary (fs_cli/args.rs)
# — the same dep `duckfs-core`/`duckfs-client` already carry for the wire side.
unicode-normalization = { workspace = true }
# the device keystore the `wallet`/`user key` verbs drive. A library rather
# than modules of this binary because the desktop app links the same code —
# it used to reach it by spawning this binary instead.
keystore = { workspace = true }
# a workspace on disk (identity, network.toml, node.toml, the invite codec)
# and the join ceremony. `config/resolve.rs` — turning those files into a
# runnable daemon — is what stayed in this binary.
workspace-config = { workspace = true }
# the node-local op-receipt blob store shared with forge + the files module.
blobstore = { workspace = true }
agent = { workspace = true }
runs = { workspace = true }
run-envelope = { workspace = true }
borsh = { workspace = true }
# the staged node-driven WireGuard plane: the reachability executor runs
# on its own plain-tokio thread (mirroring the app-surface split) behind the
# `wireguard_listen` node.toml key; the wireguard crate supplies the
# endpoint types and the phase-A fake effect it drives.
reachability = { workspace = true }
# the coordinator-auth credential types: `coord.cap` is the private-mode
# admission token a node persists beside its descriptor (minted by a genesis
# validator via `mint_coord_cap`, presented on each rendezvous request).
nat-traversal = { workspace = true, features = ["runtime"] }
wireguard = { workspace = true }
# the voice hub's transport seam: huddle media rides data-plane datagrams over
# the per-service overlay sockets (src/voice_plane.rs binds them); the mesh arm
# it replaced is retired.
data-plane = { workspace = true }
# the userspace overlay routing seam: the mesh's
# runtime context is wrapped so dial/bind route overlay ULAs by address.
overlay-net = { workspace = true }
futures = "0.3"
bytes = "1"
serde_json = { workspace = true }
# the airlock client/verify surface is anyhow-typed and reports measurements as
# hex; both already ride in on the airlock dependency above.
anyhow = "1"
hex = "0.4"
# compact, url-safe text encoding for the invite blob (replaces hex-of-toml).
base64 = "0.22"
# the http/ws app surface, shared with the embedded daemon: NodeCommand lane,
# axum router, and serve() — this binary only owns the pump-side of the lane.
noded = { path = "../../crates/noded" }
# the derived read-model tier: bin/node reuses noded's store construction and
# /v1/index/* + /v1/blocks lanes, folds each sealed block (ops + explorer row)
# in its drain/replay, and re-derives views from verified state at
# sync/recovery boundaries.
indexer = { workspace = true }
# the app-surface thread runs plain tokio (axum); the node itself stays on
# commonware's runner. the promoted-validator boot catch-up also uses Tokio's
# bounded mutex/timeout around the temporary statesync client; `signal` drives
# the SIGTERM/SIGINT graceful-checkpoint arm of the run loop. the `taskdump`
# feature behind the SIGUSR1 task dump is added by the Linux-only target
# table below: tokio makes it a compile_error! on any other OS.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-std", "io-util"] }
# a request body reaches the loopback upstream as a channel of frames, and
# `reqwest::Body::wrap_stream` wants a Stream: this is the adapter that makes a
# receiver one, without holding the body to build it.
tokio-stream = "0.1"

commonware-runtime = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
# `Unreliable<Feedback>` is the return type of commonware-p2p's `CheckedSender::send`,
# which `mesh_lanes`'s epoch-stamping sender wraps.
commonware-actor = { workspace = true }
commonware-consensus = { workspace = true }
commonware-utils = { workspace = true }
commonware-codec = { workspace = true }

serde = { workspace = true }
reqwest = { workspace = true }
# WebSocket bridge to a route's loopback upstream (ws://127.0.0.1, no TLS).
tokio-tungstenite = "0.24"
sha2 = { workspace = true }
# Validate standalone executor archives before extracting their runtime assets.
tar = "0.4"
# `release sign-bundle` unpacks the bundle it sends and the one it receives
# into a scratch dir that goes away on every exit path.
tempfile = "3"
flate2 = "1"
toml = "0.8"
# identity keygen entropy (`Signer::random`).
rand = "0.8"
# encrypted `user.key` v1 codec: mnemonic <-> seed encoding, argon2id
# KEK derivation, and the XChaCha20-Poly1305 AEAD wrapping it at rest.
bip39 = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
# the node's own events (noded::log installs the subscriber). the p2p/consensus
# internals ride the same filter: RUST_LOG=commonware_p2p=debug.
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cap glibc's malloc arenas before any thread spawns (src/resource_limits.rs).
libc = { workspace = true }
# the `agent install` checklist (src/executors.rs). default-features off: the
# editor/password/history extras are prompts this binary does not have, and
# each carries its own dependency. What is left is 4 crates, `console` being
# the terminal one clap's own graph already pulls.
dialoguer = { version = "0.12.0", default-features = false }

# App Nap opt-out (see main.rs `hold_macos_activity`): a desktop-spawned node
# lives in the GUI app's coalition and would otherwise be timer-coalesced the
# moment the app hides to the menu bar. already in the workspace lockfile via
# another workspace dependency — this adds no new supply chain.
# `Handle::dump()` for the SIGUSR1 task dump (src/task_dump.rs). tokio
# supports the feature only here and refuses it elsewhere with a
# compile_error!, so it rides a target table, never the main line; the
# `--cfg tokio_unstable` it also needs is scoped the same way in
# .cargo/config.toml. features unify per target, so this ADDS to the tokio
# line above on Linux and is absent everywhere else.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tokio = { version = "1", features = ["taskdump"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

[features]
# Real TEE quote verification: `user cred inspect|seal` (src/cred_seal.rs)
# and, forwarded through provider-host, broker-host's `AirlockTrust::Attested`
# arm. Off by default — dcap-qvl/sev/a second reqwest-0.13 stack ship only
# when a node will actually attest a remote TEE gateway or bootstrap one; the
# self-hosted lender path never attests. `airlock/testkit` rides along so the
# one test that exercises it (tests/airlock_gateway_e2e.rs, gated
# `#![cfg(feature = "verify")]`) has its minted test enclave.
verify = ["airlock/verify", "airlock/testkit", "provider-host/verify"]

# the process-level e2e suite (tests/) spawns REAL `ducktape` binaries and
# drives them through the rpc with TYPED interface-crate payloads — payload
# drift fails to compile instead of rotting silently like the old bash demo.
[dev-dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
ducktape-forge-service = { path = "../forge-service" }
# the node release e2e packs its own `.tar.zst` releases (tar is already a
# runtime dep above); the launcher under test unpacks them.
zstd = { workspace = true }
# the shared raw-http/port/poll harness helpers (was: a per-suite copy each).
nettest = { path = "../../crates/testing/nettest" }
# a scripted fixture lifts its guest shell out of the rootfs with the same
# tool lookup the sandbox itself uses.
sandbox-host = { workspace = true }
# the network_joiner_full statesync proof composes the reference modules too —
# a joiner must rebuild EVERY module shape, example ones included. (The test
# moved here from bin/demo when that walkthrough crate was deleted.)
greeter = { workspace = true }
kv = { workspace = true }
# `directory` left the production genesis set; the example crate survives only
# as a test tenant (the cfg(test) query codec in main.rs, network_joiner_full).
directory = { workspace = true }
# the fs/mcp e2e harnesses drive noded's in-proc daemon testkit (was: each
# hand-mirrored the NodeCommand actor). dev-only feature keeps it
# out of the production `ducktape` binary build.
noded = { path = "../../crates/noded", features = ["testkit"] }
# the ed25519 bind-auth builder, shared from identity (was: a per-suite copy).
# dev-only feature keeps it out of the production binary build.
identity = { workspace = true, features = ["testkit"] }
# the passkey/wallet signers the `account login` and auth-page tests fake a
# browser ceremony with.
keyscheme = { workspace = true, features = ["testkit"] }
# the git-history/packfile builder. the forge e2e needs REAL objects in the
# node's store for a PR diff to be computable, and consensus has no
# commit-building op — this is how production gets them too (a stock git push).
forge = { workspace = true, features = ["testkit"] }
async-trait = { workspace = true }
# `lane_key_lint.rs` parses `bin/node/src` rather than matching text in it: the
# `#[cfg(test)]` half is shared with topology's `wasm_embed.rs` (source-lint),
# the `LaneKey` half is the lint's own.
syn = { version = "2", features = ["full", "visit", "parsing"] }
source-lint = { workspace = true }
# the mcp harness genesis has no commonware runtime context, so the agent
# registry rides the in-memory MerkleStore test double.
sdk-testkit = { workspace = true }
# paused-clock unit tests (`#[tokio::test(start_paused = true)]`) — the
# first-contact window guard proves "a mute plane cannot hang the race"
# in milliseconds of wall time instead of minutes.
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
# the componentizer: the self-heal e2e builds the seed repository's guest the
# way the network's own modules are built.
guest-builder = { path = "../guest-builder" }
# airlock is also a runtime dependency (see [dependencies]) — same base
# features here; airlock_gateway_e2e.rs is the one test that needs the
# minted-chain testkit, and it rides in through this crate's own `verify`
# feature (see [features] above), not unconditionally. axum serves the
# in-process mock upstream that test swaps into.
airlock = { path = "../../crates/airlock", features = ["client", "server"] }
axum = "0.8"
data-plane = { workspace = true, features = ["sim"] }
# voice::overlay_e2e stands two userspace WireGuard overlay stacks up on
# loopback (the crates/networking/overlay-net/tests/loopback_pair harness shape) to
# prove huddle media crosses the REAL overlay headless — this derives the
# fixture WireGuard keypairs; the tunnel crypto rides overlay-net (a dep above).
x25519-dalek = { workspace = true }
# replica::tests assembles real finalization certificates (sign -> assemble)
# to exercise the cert-lane decode + fold planner.
commonware-parallel = { workspace = true }
# coordinated_invite_cli seeds a signed mesh-state.json so `invite` bundles
# member fronts, building the persisted adverts with the same crates the node
# already depends on (reachability::store + wireguard advert types +
# commonware's Sha256) — all normal [dependencies] above, so the integration
# tests see them without a redundant [dev-dependencies] re-listing.
