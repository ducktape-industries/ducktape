[package]
name = "node-bin"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ducktape"
path = "src/main.rs"

[dependencies]
abi = { workspace = true }
blob = { workspace = true, features = ["store"] }
borsh-json = { workspace = true }
clap = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-runtime = { workspace = true }
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
ducktape-home = { workspace = true }
files = { workspace = true }
futures = { workspace = true }
hex = "0.4"
host = { workspace = true }
identity = { workspace = true }
keyscheme = { workspace = true }
keystore = { workspace = true }
node = { workspace = true }
noded = { workspace = true }
programs-sdk = { workspace = true }
rand = { version = "0.10", features = ["sys_rng"] }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "io-util", "net", "process"] }
tracing = { workspace = true }
wasmparser = { workspace = true }

[dev-dependencies]
borsh = { workspace = true }
fixture-wasm = { workspace = true }
live-wire = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
