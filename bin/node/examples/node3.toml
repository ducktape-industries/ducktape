# node 3 — the SYNC-ONLY joiner. a mesh member but NOT a consensus participant
# (until governance admits its key and the validators cut over to epoch 1).
# run with `--sync-only`: it pulls a manifest + every module from node 0 over
# the statesync channel, rebuilds them against their committed roots, prints
# `synced root_hash=`, and exits.
id = 3
listen = "127.0.0.1:52203"
namespace = "ducktape-demo"
peer_seeds = [0, 1, 2, 3]
validator_seeds = [0, 1, 2]
# no `modules`: the set this binary's own build staged beside it (see node0.toml)
bootstrapper_addr = "127.0.0.1:52200"
storage_dir = "/tmp/ducktape-3"
