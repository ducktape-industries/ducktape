# node 0 — the bootstrapper. binds :52200. id 0 => it bootstraps nobody
# (everyone else dials it). namespace + peer_seeds MUST match every other node.
id = 0
listen = "127.0.0.1:52200"
namespace = "ducktape-demo"
# mesh = validators + the sync-only joiner (seed 2); consensus stays [0, 1].
peer_seeds = [0, 1, 2, 3]
validator_seeds = [0, 1, 2]
# the genesis wasm set: no code is embedded in the binary, so every node of the
# cluster must run on the SAME founding set. No `modules` key here means the
# set the running binary's own build staged beside it, which is the same set
# for every node of this cluster — and the directory carries the checkout's
# path in its name, so no checked-in file can spell it. Point `modules` at a
# directory only to run a cluster on a set that is not this build's.
storage_dir = "/tmp/ducktape-0"
rpc_listen = "127.0.0.1:52300"
