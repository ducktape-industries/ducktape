[package]
name = "coordinator-bin"
edition.workspace = true
version.workspace = true

[lib]
name = "coordinator_bin"
path = "src/lib.rs"

[[bin]]
name = "coordinator"
path = "src/main.rs"

[dependencies]
nat-traversal = { workspace = true, features = ["runtime"] }
# the host readings in the metrics line: `getrusage` for CPU time on every
# host, `proc_pidinfo` for the resident set on macOS
libc = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "macros", "time"] }
# reading the PUBLIC genesis valset out of network.toml (--genesis-set). No
# secret, no node-crate dependency: a local GenesisPin struct + hex decode.
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }
serde = { workspace = true }
toml = "0.8"
# The coordinator's whole log sink. It has no LogRing and no node-crate
# dependency, so it installs its own stderr subscriber rather than inverting
# that boundary to reuse `noded::log`.
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "process", "io-util"] }
commonware-cryptography = { workspace = true }
tempfile = "3"
