[package]
name = "simnode"
edition.workspace = true
version.workspace = true

# the deterministic scenario node: serves the SAME /v1 http+ws wire as noded
# (the router is literally noded's), but block production is test-controlled.
# submits are HELD until a /sim/step commits them, a logical clock replaces
# wall time, and a /sim control lane scripts the node from the outside —
# concurrent-writer blocks, persona switches (local daemon vs networked
# validator wire shapes), stepwise oracle drains. dev/test tool only; it is
# never part of a release.

# the engine (boot()/SimOpts/SimHandle) is a library so it can be embedded —
# e.g. from the iced app's tests — without spawning the binary. the binary is
# a thin `main` over it.
[lib]
name = "simnode"
path = "src/lib.rs"

[[bin]]
name = "ducktape-simnode"
path = "src/main.rs"

[dependencies]
host = { workspace = true }
# the module composition catalog this composer draws its genesis selection from.
# NO module crate is linked here any more: every tenant of the sim's genesis is
# a wasm component read from the modules dir and composed through
# `noded::compose`, so the binary knows module ids, not module structs.
topology = { workspace = true }
# the founding set's resolution: the sim composes from the set the build
# staged beside its executable when no `--modules` names another.
workspace-config = { workspace = true }
sdk = { workspace = true }
# the two module wire codecs the echo oracle speaks: a saga worker request in,
# a saga follow-up (bid, then result) out over a dispatch WorkSpec.
dispatch = { workspace = true }
saga = { workspace = true }
# the node-local op-receipt blob store shared with forge + the files module.
blobstore = { workspace = true }
# variable-length hex decode for the `hex:` origin escape and `--with-valset`
# genesis keys (raw ed25519 bytes the JSON-string origin lane cannot express).
duckfs-core = { workspace = true }
# the sim installs the SAME subscriber the real node does (noded::log), so a
# scenario sees the module breadcrumbs a wasm guest has no other way to emit.
noded = { path = "../../crates/noded" }
tracing = { workspace = true }
# `boot` calls `enable_compilation_cache` when DUCKTAPE_WASM_CACHE_DIR is set:
# the sim suite's 13-plus test binaries all compile the same genesis, so the
# cache is shared across them. A real node never calls this hook.
wasm-host = { workspace = true }
# the replication layer: the sim actor runs on `OrderedNode<StepOrderer,
# NullSink>` — the SAME apply/drain/projection engine the validator uses, with
# a scripted FIFO orderer and a logical-clock time policy. `sim` toggles the
# pre-decoded ingress (`submit_decoded`) for the UNSIGNED /sim/peer-block +
# hex: lanes; the wire op-frame codec gains no unsigned variant. `node::
# decode_frame` still verifies a signed frame's signature and yields the
# VERIFIED signer as the op origin — the SAME function every validator and the
# embedded daemon use (also available to the frame/batch tests for composing
# frames via `node::encode_frame`).
node = { workspace = true, features = ["sim"] }
# the durable block index — /v1/blocks and /v1/index/* read it, the sim actor
# feeds it block-by-block exactly like the real daemons.
indexer = { workspace = true }

commonware-runtime = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# `executor` powers the SimHandle's synchronous methods: block_on a futures
# oneshot reply from the caller's (runtime-less) thread — the same seam
# noded's actor_api uses.
futures = { version = "0.3", features = ["executor"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[dev-dependencies]
# the module crates the SCENARIOS speak with — wire types and constants only
# (`gateway::RouteDefinition`, `tasks::MAX_ATTEMPTS`, the local governance
# contract,
# `runs::MAX_ACTIONS_PER_SESSION`, `files::Change`). a test composes the same
# wasm genesis the binary does; these encode what it submits to it.
files = { workspace = true }
gateway = { workspace = true }
runs = { workspace = true }
tasks = { workspace = true }
# the shared raw-http/port/poll harness helpers (was a local copy in harness/).
nettest = { path = "../../crates/testing/nettest" }
# the ed25519 bind-auth builder, shared from identity (was: a per-suite copy).
identity = { path = "../../crates/modules/system/identity", features = ["testkit"] }
# sim_e2e spawns the real binary and needs isolated storage roots.
tempfile = "3"
# core_scenarios signs identity member-consent certificates.
commonware-cryptography = { workspace = true }
