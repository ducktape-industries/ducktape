[package]
name = "app-launcher"
edition.workspace = true
version.workspace = true

# The desktop app's boot-time executor: `Ducktape.app`'s CFBundleExecutable on
# macOS, `current/ducktape-launcher` behind the `.desktop` entry on Linux. It
# reads `state.json`, runs `app_update::step` on `Boot`, performs the flip or
# rollback it is told, then `exec`s `ducktape-app` — same PID, argv passed
# through. Kept tiny on purpose: no GUI toolkit, no network, no async; it
# ships inside every release and a broken one strands the user.
[dependencies]
app-update = { workspace = true }
libc = { workspace = true }
# the swap journal (macOS) and the state file share serde_json.
serde = { workspace = true }
serde_json = { workspace = true }
# a release's identity for `install`: sha256 of its `ducktape-app`.
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "ducktape-launcher"
path = "src/main.rs"
