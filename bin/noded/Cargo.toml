[package]
name = "noded-bin"
edition.workspace = true
version.workspace = true

# the `ducktape-noded` binary: the app-facing node daemon process. Everything
# it serves — the actor lane, the axum /v1 router, the index/blob/stream lanes,
# the module composer, the in-process testkit — is the `noded` LIBRARY
# (crates/noded); this package owns only the process shape: argv, the storage
# root, the modules dir its genesis composes from, and the two runtimes.
[[bin]]
name = "ducktape-noded"
path = "src/main.rs"

[features]
# forwards to `noded/verify` — real TEE quote verification for the airlock
# `Attested` trust arm, off by default. `cargo build -p noded-bin --features
# verify` is the working flag for `ducktape-noded`, the same as `node-bin`'s
# own `verify` is for `ducktape`.
verify = ["noded/verify"]

[dependencies]
noded = { path = "../../crates/noded" }
host = { workspace = true }
# the module composition catalog this composer draws its genesis selection from.
topology = { workspace = true }
sdk = { workspace = true }
node = { workspace = true }
indexer = { workspace = true }
# resolves the founding set the build staged beside the binary — the default
# `--modules` dir the genesis composes from.
workspace-config = { workspace = true }
commonware-runtime = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
commonware-cryptography = { workspace = true }
# daemon_e2e spawns the real binary over http/ws and needs isolated storage
# roots plus the duckfs client transport as the full-stack proof of the wire.
base64 = { workspace = true }
duckfs-client = { workspace = true }
nettest = { path = "../../crates/testing/nettest" }
# typed programmable-user and attribution assertions over the real daemon.
agent = { workspace = true }
attribution = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
