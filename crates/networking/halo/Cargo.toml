[package]
name = "halo"
edition.workspace = true
version.workspace = true

[features]
sim = []

[dependencies]
abi = { workspace = true }
blobs = { workspace = true }
borsh = { workspace = true }
bytes = "1"
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-runtime = { workspace = true }
commonware-stream = { workspace = true }
futures = { workspace = true }
live-wire = { workspace = true }
quinn = { workspace = true }
rand_core = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = "2"
x509-parser = { workspace = true }

[dev-dependencies]
halo = { workspace = true, features = ["sim"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
