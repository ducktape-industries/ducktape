[package]
name = "reachability"
edition.workspace = true
version.workspace = true

[features]
# The native backend is only available to deterministic scenario harnesses.
native-tests = []

[dependencies]
# the rendezvous retry loop runs forever; its failures were discarded.
tracing = { workspace = true }
chacha20poly1305 = { workspace = true }
commonware-cryptography = { workspace = true }
nat-traversal = { workspace = true, features = ["runtime"] }
netstack-machine = { workspace = true }
netstack-wasm = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros"] }
wireguard = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
wat = "1"
reachability = { path = ".", features = ["native-tests"] }
nat-traversal = { workspace = true, features = ["simnat"] }
tempfile = { workspace = true }
# test-util: the simulated-NAT acceptance suite runs the resolver's real
# timeouts on the paused clock.
tokio = { workspace = true, features = [
    "net",
    "rt",
    "time",
    "sync",
    "macros",
    "rt-multi-thread",
    "test-util",
] }
