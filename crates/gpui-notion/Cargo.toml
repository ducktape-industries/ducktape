[package]
name = "gpui-notion"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Notion-like block editor for GPUI, with Tiptap's Notion-like editor template as its feature surface"
license = "MIT"
repository = "https://github.com/orthory/gpui-notion"
keywords = ["gpui", "editor", "notion", "tiptap", "rich-text"]
categories = ["gui", "text-editors"]

[lib]
name = "gpui_notion"
path = "src/lib.rs"

[[bin]]
name = "gpui-notion"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.6.1", features = ["tree-sitter-languages"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-segmentation = "1"
regex = "1.13.1"

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }

# No [profile] here: this crate is a workspace member now, and Cargo ignores
# profiles outside the workspace root — it warned on every invocation. The
# root's profiles apply.
