[package]
name = "probe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi = { path = "../../../abi" }
guest = { path = "../../../guest" }
borsh = { version = "1", default-features = false, features = ["derive", "std"] }

[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
