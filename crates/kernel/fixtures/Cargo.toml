[workspace]
resolver = "2"
members = ["access", "awaiter", "awaits", "egress", "oracle", "ownership", "probe", "probe-batch", "programs", "valset", "relay", "identity", "blobs", "scheduler", "halo"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
abi = { path = "../abi" }
program = { path = "../program" }
blob = { path = "../../blob" }
borsh = { version = "1", default-features = false, features = ["derive", "std"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
