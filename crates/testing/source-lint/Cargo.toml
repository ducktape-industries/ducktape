[package]
name = "source-lint"
edition.workspace = true
version.workspace = true

# dev/test-only shared support for the repo-wide source lints. NOT a production
# crate — no shipping crate depends on it. It holds the half those lints have in
# common: which files hold shipped code, and which items inside one do. Both
# lints that use it got that half wrong the same way when each owned a copy, so
# it is one answer now, made by parsing rather than by matching text.

[lib]
name = "source_lint"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut", "clone-impls"] }
