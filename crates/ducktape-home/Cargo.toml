[package]
name = "ducktape-home"
edition.workspace = true
version.workspace = true

# ONE resolution of this operator's on-disk root, and nothing else.
#
# A leaf with ZERO dependencies on purpose. Its readers are the `ducktape`
# CLI and the desktop app, and anything added here lands in both graphs, so
# nothing is.
#
# The home holds one directory per workspace and nothing else; a workspace's
# own layout is `noded::Workspace`'s — this one knows only the root the
# workspaces hang off.
[dependencies]
