[package]
name = "topology"
edition.workspace = true
version.workspace = true

# the module composition catalog: ONE source for the module id universe, its
# shape (code/backing), its genesis-config schema, and the named genesis selections
# every composer (node, noded, simnode, demo) draws from. Pure `&'static str`
# data with no dependencies — a plan, never a root-hash: each backend still
# instantiates its selection itself.

[dependencies]

[dev-dependencies]
# the repo-wide source lints in tests/ parse Rust rather than pattern-match it:
# `wasm_embed.rs` has to tell a `#[cfg(test)]` item from production code, and a
# `.wasm` literal from a brace inside a string. The first half is shared with
# node-bin's `lane_key_lint.rs` (source-lint); the `.wasm` half is this file's.
syn = { version = "2", features = ["full", "visit"] }
source-lint = { workspace = true }
