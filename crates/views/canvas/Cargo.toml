[package]
name = "canvas-view"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
boards = { path = "../../modules/apps/boards", default-features = false }
ducktape-view-guest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true

[features]
host-verification = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "=46.0.3"
optional = true
default-features = false
features = ["cranelift", "runtime", "component-model"]

[[test]]
name = "wasm"
required-features = ["host-verification"]
