[package]
name = "node-view"
version = "0.1.0"
edition = "2024"
publish = false

# A dynamically loaded WASM view; component exports require unsafe export names.
[lib]
crate-type = ["cdylib", "rlib"]
# Integration tests drive the view natively through the wire.

[dependencies]
futures.workspace = true
# the product icon set, as bytes the wire carries
serde.workspace = true
serde_json.workspace = true
ducktape-view-guest.workspace = true
