# Rust-authored WASM views are loaded from files; GPUI renders their wire trees.
# A separate workspace keeps the WASM build profile independent of the desktop.
[workspace]
resolver = "2"
members = ["governance", "members", "agents", "node", "explorer", "settings", "chat", "files", "pages", "forge", "support/design", "support/guest", "pages/tests/editor-binding-app"]

[workspace.dependencies]
futures = "0.3"
ducktape-view-guest = { path = "support/guest" }
design = { path = "support/design" }
ui-lang-wire = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "31cf09a8e9206eff89552e42079b0fee237c08ab" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
