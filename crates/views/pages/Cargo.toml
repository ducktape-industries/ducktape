[package]
name = "pages-view"
version = "0.1.0"
edition = "2024"
publish = false

# Rust-authored declarative UI, dynamically loaded as a WASM component.
[lib]
crate-type = ["cdylib", "rlib"]
# Integration tests drive the guest directly through its wire contract.

[dependencies]
futures.workspace = true
pulldown-cmark = "0.12.2"
ui-lang-wire.workspace = true
# Shared document font families for Markdown presentation.
design = { path = "../support/design" }
serde.workspace = true
serde_json.workspace = true
ducktape-view-guest.workspace = true
