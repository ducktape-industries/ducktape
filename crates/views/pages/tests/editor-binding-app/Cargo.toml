[package]
name = "pages-editor-binding-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
pulldown-cmark = "0.12.2"
design = { path = "../../../support/design" }
view-wire = { workspace = true }
serde = { version = "1", features = ["derive"] }
ducktape-view-guest = { workspace = true }

[dev-dependencies]
# the snapshot tag is a digest of this fixture's own state layout; the tracer
# that derives it is host-only and never reaches the built component
view-wire = { workspace = true, features = ["schema"] }

[features]
host-verification = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "46"
optional = true
default-features = false
features = ["cranelift", "runtime", "cache", "parallel-compilation", "component-model"]

[[test]]
name = "wasm"
required-features = ["host-verification"]
