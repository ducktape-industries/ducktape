[package]
name = "gateway"
edition.workspace = true
version.workspace = true

# Identity-authorized, consensus-replicated `.duck` routes to DuckFS or one
# node-local loopback HTTP upstream. This crate owns no sockets, ports,
# browser, proxy process, or filesystem I/O.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
gateway-wire = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
# the store-record codec: compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
identity = { workspace = true }
# the `.duck` human-name → AccountId handle plane, absorbed as gateway's
# internal facet: gateway owns the whole name → AccountId → route pipeline as
# ONE consensus module. `duckdns` is now a LIBRARY gateway wraps — its
# `Registry`, shared value types, and handle-admission grammar — not a
# consensus module of its own.
duckdns = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
sdk-testkit = { workspace = true }
commonware-cryptography = { workspace = true }
futures = "0.3"
