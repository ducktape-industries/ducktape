[package]
name = "identity"
edition.workspace = true
version.workspace = true

# the account registry as replicated state: an ACCOUNT (an umbrella keyed by
# its founding key) collects many MEMBER KEYS of different schemes and owns
# many NODES (each a mesh/valset identity). state is pure logic over a
# host-injected qmdb MerkleStore (StagedStore records); the module root IS the
# store's merkle root. depends on sdk + valset wire types (to member-gate
# binds) + keyscheme (the one verifier every member proof rides — shared with
# the kernel frame codec, so a member key and a frame origin verify identically).
[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# the store-record codec: compact, canonical, deterministic — the same
# envelope the derived tier's fold feed already uses. wire stays sdk::wire.
borsh = { workspace = true }
keyscheme = { workspace = true }
# the `testkit` feature's ed25519 signing helpers.
commonware-cryptography = { workspace = true }
async-trait = { workspace = true }

[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]
# test-only member-auth builders (`identity::testkit`). gates the module so a
# shipping build never compiles it. consumers enable it as a dev-dependency
# feature.
testkit = ["keyscheme/testkit"]

[dev-dependencies]
keyscheme = { workspace = true, features = ["testkit"] }
# the `p256`/`k256::ecdsa::SigningKey` types the passkey and wallet test
# helpers hand around.
p256 = { workspace = true }
k256 = { workspace = true }
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
