[package]
name = "dispatch"
edition.workspace = true
version.workspace = true

# the queue plane: the call queue (calls a module queues on behalf of a
# program account it executes, run by the host as Program-origin units) and the
# mailbox (saga results and call completions, delivered by the host between
# blocks) — plus the recipe manifests (what-to-run) and capability-routed
# dispatch over saga that feed it. 100% self-contained — no app-module imports,
# ever.
[features]
# the wasm-guest port (src/guest.rs): the store-backed dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
dispatch-wire = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
serde = { workspace = true }
# default-features = false: dispatch consumes only saga's consensus surface
# (SagaOrigin/SagaView, the codecs, the shared byte caps, the trigger msgs),
# and the `runs` guest builds this crate for wasm32 — saga's native-only
# usage-ledger mapper (indexer -> unix-only IO) must not ride along. a direct
# path dep because workspace inheritance cannot switch default features off;
# feature unification keeps native binaries (which enable saga's default
# `native`) whole.
saga = { path = "../saga", default-features = false }
# the shared capability-tag shape rule for Recipe.capability validation.
capability = { workspace = true }
# the program-account control record a Call is admitted against (identity's
# wire types only; identity never depends on dispatch, so there is no cycle).
identity = { workspace = true }
# the store-record codec for the call and mailbox records: the sdk's causal
# types derive it, so a record carrying them is one derive, not a mirror.
borsh = { workspace = true }
# the outcome digest a delivered call keeps in place of the outcome bytes.
sha2 = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the sync round trip drives the module the way a host does: construct the
# concrete QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
