[package]
name = "valset"
edition.workspace = true
version.workspace = true

# the ed25519 permissionless validator set as replicated state, over a
# host-injected qmdb store. depends only on sdk + its own interface
# (+ borsh for the tier-record codec, commonware-cryptography for ed25519 key
# validation, and commonware-codec for the from-bytes decode api).
[features]
guest = ["dep:ducktape-module-sdk"]

[dependencies]
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
# the store-record codec: compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
commonware-cryptography = { workspace = true }
# required for the PublicKey-from-bytes api: PublicKey has no TryFrom<&[u8]>, so
# `PublicKey::decode` (DecodeExt) is the crate's own canonical validation path.
commonware-codec = { workspace = true }

[dev-dependencies]
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
futures = { workspace = true }
sdk-testkit = { workspace = true }
