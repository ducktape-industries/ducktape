[workspace]
resolver = "2"
members = [
    "kv",
    "acl",
    "modules",
    "valset",
    "identity",
    "governance",
    "capability",
    "saga",
    "dispatch",
    "attribution",
    "gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
abi = { path = "../../kernel/abi" }
guest = { path = "../../kernel/guest" }
wire = { path = "../wire" }
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
