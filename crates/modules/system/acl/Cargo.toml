[package]
name = "acl"
edition.workspace = true
version.workspace = true

# the on-chain submit-policy federation: WHICH standing a target module
# requires of an external submitter, as replicated state over a host-injected
# qmdb store. allow-all by default (an empty table gates nothing); governance
# is the only author. depends only on sdk + its own interface (+ borsh for the
# policy-record codec).
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
acl-wire = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
# the store-record codec: compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# the dispatch-gate proof drives a real host over acl + valset + identity.
host = { workspace = true }
valset = { path = "../valset" }
identity = { path = "../identity" }
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the gate proof signs identity member-auth certificates (deterministic seeds).
commonware-cryptography = { workspace = true }
