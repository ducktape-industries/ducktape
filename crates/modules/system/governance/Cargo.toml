[package]
name = "governance"
edition.workspace = true
version.workspace = true

# member-gated governance over the validator set: proposals, ballots, and
# deterministic tally at a consensus-time deadline. depends only on `sdk` plus
# types-only interface crates (its own, valset's — membership checks go through
# host-routed queries, execution through emitted follow-up msgs), per the
# module-isolation rule. state is pure logic over a host-injected qmdb
# MerkleStore (StagedStore records); the module root IS the store's merkle
# root.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
governance-wire = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
serde = { workspace = true }
# the store-record codec: compact, canonical, deterministic — the same
# envelope the derived tier's fold feed already uses. wire stays sdk::wire.
borsh = { workspace = true }
valset = { workspace = true }
# types-only: a passing ScheduleUpgrade/CancelUpgrade emits the upgrade op, and a
# passing UpdateModule/CancelModuleUpdate emits the code-swap op, both as
# follow-ups into the one modules registry; governance never registers it.
modules = { workspace = true }
identity = { workspace = true }
# the acl sibling's wire types: SetAclPolicy proposals validate and emit its
# SetPolicy op (the same wire-types-only shape as the valset/modules deps).
acl = { workspace = true }
async-trait = { workspace = true }
# the invite capability (token + join-proof verification) is governance's own
# admission surface: minted by a member, redeemed in-consensus by `Redeem`.
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }

[dev-dependencies]
# the NATIVE sibling modules the cross-module suites compose. governance's
# shipping deps are the types-only wire crates of the same bare names, so the
# module implementations enter under `<name>-module`; each re-exports its wire
# crate, so a test may reach either through them.
valset-module = { path = "../valset", package = "valset" }
modules-module = { path = "../modules", package = "modules" }
identity-module = { path = "../identity", package = "identity" }
acl-module = { path = "../acl", package = "acl" }
host = { workspace = true }
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
