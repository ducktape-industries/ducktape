# The governance module's wire surface: actions, proposals, ballots and their
# codecs, no module — the daemon, the CLI, workspace-config and a view link
# THIS and not the module behind it. No `native` feature, no kernel host, no
# disk.
[package]
name = "governance-wire"
edition.workspace = true
version.workspace = true

[dependencies]
sdk = { workspace = true }
# a module swap names a registry kind and lane, a standing change names an
# acl standing — both keys resolve to the sibling's wire.
modules = { workspace = true }
acl = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
# `invite`: an invite token is an ed25519-signed capability; the wire verifies it.
commonware-cryptography = { workspace = true }
