[package]
name = "capability"
edition.workspace = true
version.workspace = true

# the network-wide registry of node host capabilities as replicated state.
# depends only on sdk + its own interface (+ valset wire types to gate
# announcements to current members).
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
capability-wire = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
serde = { workspace = true }
# the store-record codec: compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
valset = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
futures = { workspace = true }
sdk-testkit = { workspace = true }
