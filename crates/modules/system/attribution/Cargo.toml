[package]
name = "attribution"
edition.workspace = true
version.workspace = true

[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

# the attribution plane: the canonical record of which accounts a source
# module's object relates to, for which reasons, at which source revision —
# and the durable, cursor-addressed history of every change to those
# relations. 100% module-agnostic: source modules translate their shapes at
# their own edge; this crate imports no content module's interface, ever.
[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
# the store-record codec: compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the dispatch-shape lint parses this crate's source as a Rust AST. already in
# the graph (serde_derive, async-trait); test-only here.
syn = { version = "2", features = ["full"] }
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
