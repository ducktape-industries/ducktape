# The attribution module's wire surface: types and codecs, no module — the
# daemon, a view and a sibling module link THIS and not the module behind it.
# No `native` feature, no kernel host, no disk.
[package]
name = "attribution-wire"
edition.workspace = true
version.workspace = true

[dependencies]
sdk = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
