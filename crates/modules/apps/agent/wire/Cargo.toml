# The agent module's wire surface: the program a binding runs, the messages
# and queries the module answers, and the records it stores. Types and their
# codecs, no module — so a view or the daemon links THIS and not the executor
# behind it. Same standing as `chat-message` and `boards-wire`, for the same
# reason.
#
# It names three siblings and the SDK because its types are made of theirs —
# `sdk::{AccountNumber, CallId, Cause, ItemRef, ModuleId}`, `attribution::Reason`,
# `dispatch::{Attempt, CallOutcome, Refusal}`, `identity`'s control record. All
# four are SDK-shaped themselves: no `native` feature, no kernel host, no disk.
[package]
name = "agent-wire"
edition.workspace = true
version.workspace = true

[dependencies]
sdk = { workspace = true }
identity = { workspace = true }
attribution = { workspace = true }
dispatch = { workspace = true }
# the store-record codec (and, for interface types, the stored-embedded
# derive): compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
