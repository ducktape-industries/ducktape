[package]
name = "agent"
edition.workspace = true
version.workspace = true

# the programmable-user module: provisions keyless PROGRAM ACCOUNTS through
# identity, binds each to a structured reaction program, and runs that
# program deterministically in consensus — one invocation per attribution
# change delivered to the account, advancing through queries, queued calls
# (dispatch's call queue, run by the host as the program account) and
# reports (attribution). no model, no compute, no signing key: external work
# is a recipe dispatch whose result comes back as data.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
# the three siblings whose wire surfaces cross this edge: identity (the
# program account and its control record), attribution (the change that
# invokes a program, and the report a program emits), dispatch (the call
# queue and the mailbox a call's completion returns through). wire types
# and codecs only — no sibling's module logic is linked here.
identity = { workspace = true }
attribution = { workspace = true }
dispatch = { workspace = true }
# the store-record codec (and, for interface types, the stored-embedded
# derive): compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the dispatch-shape lint parses this crate's source as a Rust AST. already in
# the graph (serde_derive, async-trait); test-only here.
syn = { version = "2", features = ["full"] }
# the sync round-trip drives the module the way a host does: construct the
# concrete QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
