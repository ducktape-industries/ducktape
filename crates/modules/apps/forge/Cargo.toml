[package]
name = "forge"
edition.workspace = true
version.workspace = true

# a git-backed module: the consensus core (the CAS gate, attribution, the
# tracker) is pure and runs native OR as a wasm guest; the git substrate
# (real repos via VENDORED libgit2, so the node binary is self-contained — no
# host `git` install needed) is native-only, behind the `native` feature.
[features]
default = ["native"]
# the on-disk git substrate: the `Forge` module, snapshot packing, and
# materialization. the wasm tenant's `OdbBacking` twin is NOT here — it is
# `forge-odb`, so this crate names no kernel host (#2303).
native = ["dep:git2", "dep:blobstore", "dep:tracing"]
# the wasm-guest port: the pure `ForgeState` core over the host state lane +
# object plane. non-default and wasm-only (the ducktape-module-sdk bindings compile
# only for wasm32-unknown-unknown).
guest = ["dep:ducktape-module-sdk"]
# the git-history/packfile builder (`forge::testkit`). no extra deps beyond
# the substrate, but gating keeps it out of the shipped binary, exactly as
# identity/noded do with theirs.
testkit = ["native"]

[dependencies]
base64 = { workspace = true }
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
keyscheme = { workspace = true }
# the node-local blob store forge fetches Push packfiles from by digest. the
# same node-local receipt lane the daemon and the files module share; the
# packfile bytes never enter consensus (see the `PushRefs` op in state.rs).
blobstore = { workspace = true, optional = true }
# sha2 composes the state root over the 20-byte sha1 oids (always used).
sha2 = { workspace = true }
# chat's WIRE TYPES only: forge opens one hidden discussion channel per
# issue/PR (`forge:<repo>:<n>`) and posts state-change system lines into it via
# emit_msg follow-ups — the same seam runs/automations use. forge reuses
# chat's Party so the app renders forge authors through the same path.
# identity's WIRE TYPES only: forge resolves a ref-moving origin to the account
# it belongs to, so the SAME human's node-key `git push` and user-key app merge
# are attributed to one account (see `ForgeState::party_of_origin`).
duck-address = { workspace = true }
# `git push --signed`: the push certificate's OpenSSH signature is verified
# in consensus (`pushcert::signer`), by every validator.
async-trait = { workspace = true }
# the node's log plane — `materialize`'s pack-missing / refused-advance warnings
# must reach the app's Logs tab and `RUST_LOG`, which a `println!` never does.
tracing = { workspace = true, optional = true }
# vendored libgit2 (built via cmake + cc). default-features=false drops the
# ssh/https transport (openssl/libssh2) — forge only touches local repos.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"], optional = true }
# the git read types the product read policy (`query.rs`) answers in, and the
# commit/tree parsers it turns a raw object into — on BOTH arms. a zero-dep leaf
# held outside the kernel on purpose: the native arm used to bind these shapes
# out of `wasm-host`, which was the one thing keeping this module from being
# lifted out of the repository. not optional: the host hands over a raw object
# and the guest parses it here, so `parse_commit`/`parse_tree` are the read
# policy on the wasm arm too.
git-primitives = { workspace = true }
# wasm-only, behind `guest`: the port harness (WitCtx / host imports). a
# standalone-workspace path crate, pulled only when the `guest` feature builds
# for wasm32 — never by the native gate.
ducktape-module-sdk = { workspace = true, optional = true }

[dev-dependencies]
# forge's OWN integration tests need `forge::testkit`, and a crate does not
# enable its own features for its test targets. This self dev-dependency is how
# cargo lets them opt in, and it never reaches the production build.
forge = { path = ".", features = ["testkit"] }
# the NATIVE system modules the host suites register beside `Forge`; their
# plain names resolve to the wire crates above.
identity-module = { package = "identity", path = "../../system/identity" }
attribution-module = { package = "attribution", path = "../../system/attribution" }
# the SSH signer the signed-push tests mint certificates with.
keyscheme = { workspace = true, features = ["testkit"] }
# dev-only: prove forge's root composes into the global root-hash. not a
# production dep — a module still depends on sdk + its interface only.
host = { workspace = true }
sdk-testkit = { workspace = true }
futures = "0.3"
