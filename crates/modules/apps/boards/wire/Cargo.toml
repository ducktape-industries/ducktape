# The board format: shapes, bonds, the geometry bounds and the one fold that
# applies a change. Types and their codec, no module and no sdk — so the
# canvas view links THIS and not the module behind it. Same standing as
# `chat-message`, for the same reason.
[package]
name = "boards-wire"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# the reducer's shape is parsed, not described in a comment
syn = { version = "2", features = ["full"] }
