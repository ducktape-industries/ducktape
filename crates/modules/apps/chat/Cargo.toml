[package]
name = "chat"
edition.workspace = true
version.workspace = true

# the chat module: block-based channels, threads, edits, reactions, membership,
# and hook notifications on one host-injected merkle store.
#
# the consensus state machine, wire types, and sdk::Module impl always compile
# (they are the surface the wasm guest ports compile), and the pure index
# decision core (src/index.rs) compiles EVERYWHERE — it is what the index
# guest wraps. the call media planes are NOT here: they are the off-consensus
# `media-service` crate (crates/services/media), which chat's membership
# drives but never depends on.
[features]
# the wasm consensus port (src/guest.rs): the store-backed dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]
# the wasm index mapper shell (src/index_guest.rs): wires the pure index core
# into the fluent31 engine. wasm-only — enabled solely by
# `guest-builder --index`.
index-guest = ["index_guest/guest"]

[dependencies]
chat-message = { path = "message" }
sdk = { workspace = true }
# wasm-only, behind `guest`: the port harness (WitStore / WitCtx / host
# imports / the dispatch-shell macros). a standalone-workspace path crate,
# pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
# the index CONTRACT (op-row envelope + the pure StateRead/Writes kit) — not
# the engine: the default surface is pure types, wasm32-clean, and is all the
# native build sees. the engine shell rides the `index-guest` feature.
index_guest = { workspace = true }
# types-only: the attribution edge — every channel and message write reports
# its object's relation set to the plane (chat translates its shapes there).
attribution = { workspace = true }
# the canonical party bytes (`Party` in membership and creator keys); the
# wire stays sdk::wire.
borsh = { workspace = true }
# the ONE resolver (`OfKey`, `Get`) that turns a signing key into the account
# holding it: every external write resolves its party through it, and every
# mention is validated against it (see `Chat::party_of_origin`).
identity = { workspace = true }
async-trait = { workspace = true }
# the one verifier every signed artifact dispatches through — `JoinHuddle`'s
# `node_proof` rides the same ed25519 path a member key's frame does.
keyscheme = { workspace = true }
# NFC label normalization for the derived tag index (src/index/tags.rs) —
# unconditional like the index core it serves (pure, wasm32-clean).
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# the logical-key -> store-key hash (sha256); the store itself is injected.
sha2 = { workspace = true }

[dev-dependencies]
pages = { workspace = true }
futures = { workspace = true }
host = { workspace = true }
sdk-testkit = { workspace = true }
# the ed25519 keypairs a `JoinHuddle.node_proof` test signs with.
commonware-cryptography = { workspace = true }
# the tests drive the module the way a host does: construct the concrete
# QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
tempfile = "3"
