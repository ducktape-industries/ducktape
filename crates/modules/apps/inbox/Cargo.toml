[package]
name = "inbox"
edition.workspace = true
version.workspace = true

[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]
# the wasm index mapper shell (src/index_guest.rs): wires the pure index core
# into the fluent31 engine. non-default and wasm-only — enabled solely by
# `guest-builder --index`.
index-guest = ["index_guest/guest"]
# test-only inspection reads (`Inbox::queue_view` + the seq-saturation
# injector). no extra deps — just gates the seam so a shipping build never
# compiles it. consumers enable it as a dev-dependency feature.
testkit = []

[dependencies]
inbox-wire = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
# the index CONTRACT (op-row envelope + the pure StateRead/Writes kit) — not
# the engine: the decision core (src/index.rs) compiles natively for the node
# and its tests. the engine shell rides the `index-guest` feature.
index_guest = { workspace = true }
sdk = { workspace = true }
# the two collaborators' wire surfaces: the attribution plane whose canonical
# changes this inbox receives (`AttributionEvent`, `ChangeRef`), and identity,
# the resolver of recipients and admin keys (`AccountNumber`, `Control`).
attribution = { workspace = true }
identity = { workspace = true }
# the store-record codec: compact, canonical, deterministic. wire stays sdk::wire.
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# self dev-dependency: unifies the `testkit` feature into the lib the
# integration tests link, so `queue_view` exists there and never in a
# shipping build.
inbox = { path = ".", features = ["testkit"] }
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
futures = "0.3"
sdk-testkit = { workspace = true }
