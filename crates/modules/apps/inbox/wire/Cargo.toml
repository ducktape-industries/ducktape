# The inbox module's wire surface: items, change refs, messages, queries and
# replies, no module — a view and a sibling module link THIS and not the
# module behind it. It names `attribution` (an item points at a change) — that
# key resolves to `attribution-wire`. No `native` feature, no kernel host, no
# disk.
[package]
name = "inbox-wire"
edition.workspace = true
version.workspace = true

[dependencies]
sdk = { workspace = true }
attribution = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
