[package]
name = "files"
edition.workspace = true
version.workspace = true

# Ducktape module adapter for duckfs. The reusable deterministic state machine
# lives in duckfs-core; disk persistence lives in duckfs-disk. `files` keeps the
# consensus module id and SDK capability glue, plus the public core re-export.
[features]
default = ["native"]
native = [
  "dep:duckfs-disk",
  "dep:sdk",
  "dep:async-trait",
  "dep:serde_json",
  "dep:tracing",
  "dep:identity",
  "dep:attribution",
]
# the wasm-guest port: `FilesGuest` runs `duckfs_core::Fs<GuestOdb>` over the
# WIT object plane, single-sourcing the op semantics with `native`. non-default
# and wasm-only (the ducktape-module-sdk bindings compile only for
# wasm32-unknown-unknown); pulls its `odb` feature for `GuestOdb`.
guest = ["dep:ducktape-module-sdk", "dep:sdk", "dep:serde_json", "dep:identity", "dep:attribution"]

[dependencies]
duckfs-core = { workspace = true }
duckfs-disk = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sdk = { workspace = true, optional = true }
identity = { workspace = true, optional = true }
attribution = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# native only: the module glue narrates a SKIPPED gc sweep. the pure core and
# the wasm guest never log — no tracing reaches either.
tracing = { workspace = true, optional = true }
# wasm-only, behind `guest`: the port harness (GuestOdb / WitCtx / host imports).
# a standalone-workspace path crate, pulled only when the `guest` feature builds
# for wasm32 — never by the native gate.
ducktape-module-sdk = { workspace = true, features = ["odb"], optional = true }

[dev-dependencies]
commonware-cryptography = { workspace = true }
# the host e2e + cross-host determinism suite stands the real `Files` module on
# the deterministic kernel host and drives it through `submit_at`/`query`.
host = { workspace = true }
# Actual call receipts must carry minted snapshot IDs through assigned stamps.
dispatch = { workspace = true }
# the NATIVE system modules the host suites register beside `Files`. their
# plain names resolve to the wire crates above, so the module crates take a
# second name here.
identity-module = { package = "identity", path = "../../system/identity" }
attribution-module = { package = "attribution", path = "../../system/attribution" }
dispatch-module = { package = "dispatch", path = "../../system/dispatch" }
# the shared `TestCtx` the duckfs harness builds on (dev-only, Module Rule intact).
sdk-testkit = { workspace = true }
futures = "0.3"
tempfile = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
