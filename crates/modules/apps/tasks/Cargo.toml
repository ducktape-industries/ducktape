[package]
name = "tasks"
edition.workspace = true
version.workspace = true

# the consensus state machine, wire types, sdk::Module impl, AND the pure
# index decision core (src/index.rs) always compile — natively for the node
# and to wasm32 for both guest artifacts. the two features are the guests:
[features]
# the wasm consensus port (src/guest.rs): the store-backed dispatch shell over
# ducktape-module-sdk. wasm-only — enabled solely by the guest-builder's
# synthesized cdylib workspace.
guest = ["dep:ducktape-module-sdk"]
# the wasm index mapper shell (src/index_guest.rs): wires the pure index core
# into the fluent31 engine. wasm-only — enabled solely by
# `guest-builder --index`.
index-guest = ["index_guest/guest"]

[dependencies]
tasks-wire = { workspace = true }
sdk = { workspace = true }
identity = { workspace = true }
attribution = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# the index CONTRACT (op-row envelope + the pure StateRead/Writes kit) — not
# the engine: the default surface is pure types, wasm32-clean, and is all the
# native build sees. the engine shell rides the `index-guest` feature.
index_guest = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# wasm-only, behind `guest`: the port harness (WitCtx / host imports / the
# dispatch-shell macros). a standalone-workspace path crate, pulled only when
# the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }

[dev-dependencies]
futures = "0.3"
host = { workspace = true }
sdk-testkit = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
# the tests drive the module the way a host does: construct the concrete
# QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
