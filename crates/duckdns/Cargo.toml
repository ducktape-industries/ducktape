[package]
name = "duckdns"
edition.workspace = true
version.workspace = true

# `.duck` account naming library: wire types, hostname grammar, replicated
# registry, and canonical state codec. Consumed by the `gateway` module, which
# owns the authenticated AccountId derivation through Identity.
#
# NOT a consensus module — no `sdk::Module` impl, no MODULE_ID, no guest wasm,
# not in `host::topology`. It was one under crates/modules/system/ until
# `a98c506ed` merged duckdns into gateway and left the library behind; it lives
# beside `crates/airlock` now because its consumers span both sides of the
# chain line (the `gateway` module onchain, node/noded/simnode/demo host-side),
# so it belongs under neither.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
