# airlock — the barrier between execution and auth. The pure attestation +
# sealing + session-key handshake core, plus the async client (behind the
# `client` feature). An off-consensus feature crate; like `reachability` it uses
# vetted RustCrypto primitives (x25519/chacha/sha2) directly rather than the
# consensus identity stack, since none of this touches consensus signing.
[package]
name = "airlock"
edition.workspace = true
version.workspace = true
publish = false

[lib]
name = "airlock"
path = "src/lib.rs"

[features]
# The async HTTP client side of the handshake (Gateway + fetch_quote +
# open_session + credential upload), shared by broker-host and `ducktape user cred`.
client = ["dep:reqwest"]
# The gateway HTTP service (airlock::server), used by airlock-gateway and the
# in-process e2e test. Off by default so the pure core stays IO/async-free.
# Admission of the `apple-codesign` credential kind (airlock::codesign): opens
# the PKCS#12 and reads the leaf certificate. `server` needs it to validate an
# upload; `ducktape user cred add apple-codesign` runs the same checks locally.
# Also the `POST /sign/macos-bundle` pipeline (airlock::sign): the bundle
# archive in and out (tar + zstd), the per-request tmpfs work dir, and the
# `rcodesign` runs it drives.
codesign = ["dep:p12", "dep:x509-cert", "dep:tar", "dep:zstd", "dep:tempfile", "dep:tracing"]
server = ["dep:reqwest", "dep:axum", "dep:tokio", "dep:tokio-stream", "dep:futures-util", "dep:tracing", "codesign"]
# Real quote verification: TDX via dcap-qvl (Intel root pinned in-crate), SNP
# via the AMD VCEK chain (sev crate, crypto_nossl). reqwest for PCS/KDS fetch.
verify = ["dep:dcap-qvl", "dep:sev", "dep:reqwest"]
# Test-only fake silicon: mints an SNP-format quote signed by a test chain that
# verifies ONLY under its own minted roots — never under AMD's.
testkit = ["verify", "codesign", "dep:p384", "dep:rsa", "dep:x509-cert", "dep:rand"]

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = "0.12"
sha2 = { workspace = true }
rand_core = "0.6.4"
reqwest = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "sync", "macros"] }
dcap-qvl = { version = "0.5", optional = true }
sev = { version = "8", default-features = false, features = ["snp", "crypto_nossl"], optional = true }
p384 = { version = "0.13", optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
x509-cert = { version = "0.2", features = ["builder"], optional = true }
# PKCS#12 for the `apple-codesign` credential kind: the same crate rcodesign
# opens a `--p12-file` with, so what the gateway admits is what it will sign with.
p12 = { version = "0.6", optional = true }
rand = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
tracing = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# A SELF dev-dependency, the `data-plane`/`provider-host` pattern: every feature
# in this crate is off by default, and all three integration binaries open with a
# `#![cfg(feature = ...)]` — so `cargo test -p airlock` compiled them to
# `running 0 tests` and printed a green nobody could tell from a real one. The
# e2e, the SNP verifier proof and the TDX verifier proof were all dead in the
# per-crate loop, alive only when some OTHER package's dev-deps happened to
# unify the features in (`bin/node`, `broker-host`). Turning them on here means
# the focused invocation runs what it claims to.
airlock = { path = ".", features = ["client", "server", "verify", "testkit", "codesign"] }
# The fixture test names dcap-qvl types (QuoteCollateralV3, Quote) directly.
dcap-qvl = { version = "0.5" }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
# the signing-route e2e unpacks the sealed reply and runs `rcodesign verify`
tempfile = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
