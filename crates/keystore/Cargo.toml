[package]
name = "keystore"
edition.workspace = true
version.workspace = true

# The device keystore: `<duck>/keys/<name>.key` + the `active` pointer, and the
# argon2id/XChaCha20-Poly1305 seal underneath them.
#
# NOT a program — no wasm. It was part of
# node-bin until the desktop app's only way to reach it was to SPAWN `ducktape`
# and pipe to it — which made "can the app find a binary on disk?" a
# precondition for a person opening their own key. Both the CLI and the app
# link it now.
#
# The dependency set is the point: argon2 + AEAD + ed25519 + encoding, plus the
# zero-dependency home resolver every surface shares, and nothing else. A GUI
# can link this without a validator arriving behind it.
[dependencies]
argon2 = { workspace = true }
base64 = "0.22"
# the 24-word recovery phrase a restore reads and a mint reveals.
bip39 = { workspace = true }
chacha20poly1305 = { workspace = true }
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true }
rand = "0.8"
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
