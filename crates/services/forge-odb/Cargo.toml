# the host-side git substrate a wasm `forge` tenant delegates its committed
# surface to. it serves the module without being one: the kernel drives it
# through `wasm_host::OdbBacking`, over the SAME native `Forge` the daemon lanes
# run. it lives here and not in `forge` so the module crate names no kernel host
# at all — a module is repo-separable, its host substrate is not.
[package]
name = "forge-odb"
edition.workspace = true
version.workspace = true

[dependencies]
# the durability ordering is single-sourced: this backing and the native
# `Module::commit_block` call the same `Forge::{adopt_refs, publish_block}`.
forge = { workspace = true }
blobstore = { workspace = true }
# the plain git read types `OdbBacking` speaks, named directly rather than
# through wasm-host so the substrate and the module agree by construction.
git-primitives = { workspace = true }
sdk = { workspace = true }
sha2 = { workspace = true }
# the kernel host whose `OdbBacking` trait this crate implements. no cycle —
# wasm-host has no forge dep.
wasm-host = { workspace = true }
