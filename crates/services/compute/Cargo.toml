[package]
name = "compute-service"
edition.workspace = true
version.workspace = true

# host-side worker for dispatch WorkSpec saga effects: resolve the capability
# to a local provider, assemble the run-envelope input, submit the raw answer.
# no prompt text is AUTHORED here,
# no output parsing opinions, no credential handling — contract enforcement
# is the dispatch module's consensus-side validation.
[dependencies]
async-trait = { workspace = true }
provider-host = { workspace = true }
# the pool's spawn/deliver/resolver seams are boxed futures; the semaphore
# caps concurrent provider runs (tokio::sync is runtime-agnostic).
futures = { workspace = true }
host = { workspace = true }
sdk = { workspace = true }
# the run envelope's magic + headless composer. The SCHEMA is shared with
# programs that must not link this crate (a GUI submitting a run would drag
# provider-host and the microVM sandbox in behind it); the READER stays here.
run-envelope = { workspace = true }
# the run envelope is JSON (see src/envelope.rs).
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
# every decision this crate makes about a run — skipped, deduped, delivered,
# suppressed — was invisible before: no tracing, two eprintln!s, and raw stderr
# reaches neither the app's Logs tab nor RUST_LOG.
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
