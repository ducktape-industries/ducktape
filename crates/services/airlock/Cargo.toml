[package]
name = "airlock-service"
edition.workspace = true
version.workspace = true

# the LENDER half of the airlock: the disk-backed credential store a node
# co-hosts, and the gateway router that serves it. The borrower half is
# `broker-host`; the two-party contract they share is `crates/airlock`.
#
# There is no TEE here by design. The trust anchor is the seal PUBLIC key
# published on consensus, which the borrower's broker pins — so the seal SECRET
# must be stable across restarts, which is why it lives on disk (0600) rather
# than in memory. An enclave-attested lender is the separate, minimal
# `bin/airlock-gateway`, whose measurement must not carry any of this.
[dependencies]
# the gateway router + the sealed-credential wire types. `server` only: this
# crate serves, it never verifies someone else's quote.
airlock = { path = "../../airlock", features = ["server"] }
# the router this crate hands back is an `axum::Router`; the caller owns the
# listener, so serving is theirs and only the type is named here.
axum = "0.8"
# the vendor login artifacts (.credentials.json / auth.json) are JSON.
serde_json = { workspace = true }
# the apple-codesign identity rides the wire as base64 of the PKCS#12 file.
base64 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
