[package]
name = "sdk"
edition.workspace = true
version.workspace = true

# the interface crate. NO domain deps on purpose — this is the ONLY crate a
# module is allowed to depend on, so anything that lands here becomes a shared
# surface for every module. keep it types + traits. async-trait is the one
# greenlit non-domain dep: it boxes the `Module::execute` future so the host can
# hold modules behind `Box<dyn Module>` (native `async fn` in a trait isn't
# dyn-compatible). serde + serde_json back the shared `wire` codec (the generic
# encode/decode pair every module's wire wrappers delegate to) — serialization
# primitives every module already pulls, on the same everyone-needs-it grounds
# as the zero-dep `codec` module.
[dependencies]
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# the causal-context and origin types derive the uniform store-record codec so
# a module can persist them beside its own records.
borsh = { workspace = true }
# the refusal classes `refusal` re-exports: words only, zero-dep.
refusal-class = { workspace = true }
