# Capability spec: Claude Code CLI.
#
# Embedded built-in default — see codex.toml for the annotated reference and
# docs/records/specs/capability-spec.md for the full format. The BASE tag ("claude") passes
# no --model flag: which model runs is the operator's CLI configuration (host
# policy). The [[variants]] below are the curated model/effort matrix — each
# expands at load time into a finer tag `claude_<model>_<effort>` carrying
# its own fully literal argv (base args + --model/--effort), overridable
# per tag like any other spec.
#
# Agentic posture: no --max-turns cap and `--permission-mode acceptEdits`
# (verified present in claude 2.1.202), so the CLI may run tool-use loops and
# edit files — confined to its cwd, which is the workspace the run's
# provisioner materialized for this attempt. Every run starts cold: a run's
# whole continuity is the prompt envelope (full transcript), which is what
# makes a run portable across assignees.

spec = 1

[capability]
tag = "claude"
description = "Claude Code CLI, print mode (auth via the host-owned Anthropic broker; the credential never enters the child)"

[detect]
bin = "claude"
env = "DUCKTAPE_CLAUDE_BIN"

[source]
# Where `ducktape agent install claude` gets the guest's Linux build: the
# LATEST release on Anthropic's feed, resolved at install time — `<base>/latest`
# names the version, `<base>/<version>/manifest.json` publishes a sha256 per
# platform, and `<base>/<version>/<platform>/claude` is the binary (glibc, not
# musl: the guest base is a full Ubuntu userland).
kind = "claude-releases"
base = "https://downloads.claude.ai/claude-code-releases"

[invoke]
# Headless runs may use shell, file and MCP tools without a prompt.
# The VM and committed run grant enforce access. Interactive args remain separate.
# Stream events preserve progress and failures; the final result carries delivery.
# Prompt and run controls share persistent stream-json stdin.
args = [
    "-p", "--input-format", "stream-json", "--replay-user-messages", "--permission-prompts", "host",
    "--output-format",
    "stream-json",
    "--verbose",
    "--permission-mode",
    "acceptEdits",
    "--allowedTools",
    "Bash", "Read", "Edit", "Write", "Glob", "Grep", "mcp__ducktape",
]
prompt = "stdin"
# The IDLE budget (stream output refreshes it; hard-capped at 36x). Operators
# override per tag by shadowing the spec, or via DUCKTAPE_PROVIDER_TIMEOUT_SECS.
timeout_secs = 600

[output]
# Extract the terminal `{"type":"result",...}` from the stream-json lines.
format = "claude-session"

[interactive]
# The pty-backed TUI argv, for interactive sessions (a member drives the claude
# TUI directly), as opposed to the headless [invoke] print mode above. Empty
# args = a bare `claude` launch, which opens the interactive TUI. Unlike codex,
# NOTHING is spliced into this argv: the [isolation] broker below aims claude
# entirely by ENV (ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN), so the same
# isolation applies — the credential stays in the host broker, the child gets
# only the opaque bearer + loopback base URL, and the fresh CLAUDE_CONFIG_DIR
# blocks any ~/.claude fallback. Validated live against the real claude binary
# inside a microVM (see the design spec).
args = []
# The RESTRICTED argv for a SHARED (command-lane) session: read-only + never
# prompt. A shared session is driven by ordered commands, so no single member is
# there to answer a permission prompt — plan mode is read-only and does not stop
# to ask, so it can neither wedge nor do damage. The [isolation] broker still
# aims claude by ENV, so the same credential isolation holds. Absent this key, a
# capability is solo-only.
restricted_args = ["--permission-mode", "plan"]

[isolation]
# THE STRONG AUTH PATH: the operator's credential never enters the claude
# process. The HOST reads it (ANTHROPIC_API_KEY, else CLAUDE_CODE_OAUTH_TOKEN,
# else ~/.claude/.credentials.json — the subscription path is the operator's
# flagged choice, isolated to one broker knob) and holds it in the node; a
# per-run loopback Anthropic Messages broker serves POST /v1/messages with SSE
# passthrough, and claude gets only an opaque random bearer plus a base URL,
# both of which die with the run. Neither can recover the credential.
#
# config_home_env is what MAKES that true. Pointed at a fresh, EMPTY
# CLAUDE_CONFIG_DIR under the run's workdir, claude cannot read the operator's
# ~/.claude/.credentials.json and must use ANTHROPIC_AUTH_TOKEN toward the broker
# the ANTHROPIC_BASE_URL names. Without it the broker would be decorative.
#
# There is no way to mount ~/.claude in instead: the spec format has no
# [sandbox] table, and a run's microVM shares no filesystem with the host. The
# guest reaches the host-side broker because duck-guest-init serves its port on
# the VM's own loopback and tunnels it over vsock.
# Inherited by every [[variants]] tag below.
config_home_env = "CLAUDE_CONFIG_DIR"
broker = "anthropic-messages"

[context]
# WHERE THE AGENT'S SOUL LANDS. The host assembles the agent's curated skills
# into one markdown document per run; this names the file THIS CLI already
# auto-loads it from, so no Rust ever branches on an executor name.
#
# The PARENT of the checkout, not the checkout itself — and that is the whole
# trick. claude MERGES a parent-directory CLAUDE.md with the project's own
# (verified live: both reach the model), so a repository the agent works in keeps
# its instructions and the soul layers UNDERNEATH them. Writing into the checkout
# would instead OVERWRITE the repo's CLAUDE.md — and land in the agent's commit.
#
# Being outside the checkout is also why it stays out of the snapshot: `commit`
# scans only UNDER the workdir (the same guarantee the -ro skills sibling relies
# on). The host removes the file when the run ends, and under a sandbox backend
# it is bind-mounted read-only at its identical path (it is outside the workdir
# mount, so unlike codex's config-home doc it does NOT cross for free).
# Inherited by every [[variants]] tag below.
path = "workspace-parent:CLAUDE.md"

[tools]
# WHICH MCP SYNTAX this CLI is handed the run's tool plane in — not an argv.
# The endpoint is a loopback address on the run's OWN node tunnel, drawn when
# its lane binds, so it cannot be written down in a file: the host composes
# `--mcp-config {"mcpServers":{"ducktape":{"type":"http","url":…}}}` per run
# (provider_host::mcp_argv), and the --allowedTools prefix rides with it.
#
# --allowedTools is NOT optional: in -p print mode an unapproved MCP tool call
# is a DENIAL (there is no human to approve it), so a server that is merely
# configured would be dead weight. Headless [invoke] args also allow shell and
# file tools.
#
# This reaches EVERY argv this file produces: the base tag, every [[variants]]
# tag, and the [interactive] TUI argv above — which is what gives an
# interactive SESSION the ducktape tools, since the host wires it where the run
# boots rather than where the file is parsed.
#
# Nothing about the tool plane enters the guest — no server command, no
# `ducktape` binary on its PATH, no run-scoped token in its environment. The
# run reaches the catalog over the one tunnel it already has, and the node
# knows which run is calling because the lane IS that run.
mcp = "claude"

