[package]
name = "media-service"
edition.workspace = true
version.workspace = true

# the huddle media service: the OFF-consensus real-time media planes a call
# rides — the voice engine (Opus over the data plane's `Service::Voice`
# datagram class), the video call wire (VP8 frame fragmentation/reassembly and
# call control over `Service::Video`), and the `/v1/call/ws` framing the
# webview leg speaks. Consensus never carries media: nothing here touches a
# qmdb store or the root-hash, which is why it is a service crate and not part
# of the chat module whose channel membership drives its admission.

[dependencies]
# the datagram transport the media planes ride, and the peer identity that
# names every speaker (the plane's WireGuard identity binding).
data-plane = { workspace = true }
# the huddle's picture codec (`video::codec`): intra-only JPEG both ways.
# Here rather than in the app because both APIs are generic and instantiate
# in their caller — this crate is the one the dev profile optimizes.
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
opus-rs = { workspace = true }
# one random per-session media epoch: the field that tells a receiver a peer
# restarted their stream rather than replaying an old one.
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
# `ducktape::voice`: a peer's speaker lane opening — once per peer per
# engine, never per frame.
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }
# the voice e2e proofs drive the data plane's deterministic sim transport.
data-plane = { workspace = true, features = ["sim"] }
