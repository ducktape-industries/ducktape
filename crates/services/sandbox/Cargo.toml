[package]
name = "sandbox-host"
edition.workspace = true
version.workspace = true

# the shared sandbox muscle: HOW a node-local child is spawned in isolation.
# the SandboxBackend seam + its boot probe, the Firecracker microVM each run
# gets, and the workspace it is handed as a block device. carved out of
# provider-host, which remains the only in-tree caller of the run path.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# "net" pulls tokio::net::UnixStream — the guest's vsock lands on one, and so
# does each tunnel; "process" spawns the VMM; "io-util" frames the guest stream.
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tracing = { workspace = true }

# the VMM's parent-death signal: `PR_SET_PDEATHSIG` is what ends a guest whose
# daemon was SIGKILLed, and it is Linux's alone.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# the service-root singleton test claims a real directory twice.
tempfile = "3"
# the vm-smoke example needs a runtime of its own; the library stays
# runtime-agnostic. "test-util" drives the tunnel idle-timeout tests on a
# paused clock instead of real sleeps.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[features]
# the test-harness `SandboxBackend::Bare` spawn. a `cfg(test)` gate cannot cross
# a crate boundary, so the variant provider-host's unit tests construct hangs
# off this feature instead — off in every shipped build, so a released binary
# still cannot express a bare spawn.
testkit = []
