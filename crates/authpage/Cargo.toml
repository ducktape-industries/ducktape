[package]
name = "authpage"
edition.workspace = true
version.workspace = true

# the CLIENT half of the WebAuthn relying-party page (`ops/auth-page`): the
# request URL the app/CLI opens the system browser to, the one-shot loopback
# listener the page POSTs its result to, the result JSON, and the frame /
# consent builders a passkey or an Ethereum wallet completes. No node I/O —
# the CLI and the app sequence the ceremonies around their own queries.
[dependencies]
keyscheme = { workspace = true }
node = { workspace = true }
sdk = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
# Asynchronous callback sockets and relay polling.
tokio = { workspace = true, features = ["net", "io-util"] }
reqwest = { workspace = true }
tracing = { workspace = true }
# `terminal_qr`: the ceremony URL as half-block cells for a headless box's
# terminal. Core only — no image/svg renderers.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
keyscheme = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
