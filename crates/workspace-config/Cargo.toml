[package]
name = "workspace-config"
edition.workspace = true
version.workspace = true

# A ducktape workspace ON DISK: the identity file, `network.toml` (the
# shareable genesis descriptor), `node.toml` (this device's plumbing), and the
# invite codec — plus the JOIN ceremony that writes all of them from a pasted
# blob.
#
# It sat inside bin/node until the desktop app's only way to join a network was
# to spawn `ducktape node join` and diff the workspace registry around the call
# to find out which directory the child had created. Joining is not an errand
# to send a subprocess on, and unlike every other node operation there is no
# running daemon to ask: joining is what BRINGS a workspace into existence.
#
# What deliberately stayed behind in bin/node is `config/resolve.rs` — turning
# these files into a runnable daemon configuration. Reading and writing a
# workspace is what two programs do; booting one is what the daemon does.
[dependencies]
module-artifact = { workspace = true }
# THE ducktape home resolution (`$DUCKTAPE_HOME` else `~/.ducktape`), in a
# zero-dependency leaf so every reader of that root agrees about it.
ducktape-home = { workspace = true }
base64 = "0.22"
# the genesis file's record codec — the workspace's one binary artifact.
borsh = { workspace = true }
# the genesis pin: sha256 of the file, and of each component it carries.
sha2 = { workspace = true }
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
commonware-utils = { workspace = true }
# hex codecs for keys, roots and pasted blobs — the shared home.
duckfs-core = { workspace = true }
# the `duck://` grammar's chain id: the ONE rule a network name must satisfy
# (`validate_network_name`), never a second copy of its charset here.
duck-address = { workspace = true }
# the invite token's mint/verify, shared verbatim with the validator that
# admits a redemption (`governance::invite`).
governance = { workspace = true }
# the member proof an identity file's owner signs — the wire types only.
identity = { workspace = true }
# the coordinator capability a workspace persists beside its invite.
nat-traversal = { workspace = true }
rand = { workspace = true }
# the joiner's WireGuard identity, minted during the join so the boot plane and
# the intro announcer read one settled key file instead of racing to create it.
reachability = { workspace = true }
# `Vmm`/`SandboxBackend`: the `[sandbox] runtime` token this crate writes into
# node.toml, and the boot probe a fresh workspace's compute detection runs.
# Light on purpose — serde + tokio + tracing — so linking it costs a GUI
# nothing it does not already carry.
sandbox-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
# the overlay ULA a joiner folds into its reach hints for every offered front.
wireguard = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
