# A wasm module authored against the ducktape:module world. Standalone
# workspace: guest crates build to `wasm32-unknown-unknown` and are
# componentized by the module build target, never by the host workspace.
[package]
name = "object-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
replacement = []

[dependencies]
wit-bindgen = "0.57"

[workspace]
