[package]
name = "noded"
edition.workspace = true
version.workspace = true

[dependencies]
abi = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
blob = { workspace = true, features = ["node"] }
borsh = { workspace = true }
bytes = "1"
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
commonware-runtime = { workspace = true }
commonware-utils = { workspace = true }
consensus = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
halo = { workspace = true }
hex = "0.4"
keyscheme = { workspace = true }
live-wire = { workspace = true }
http-body-util = "0.1"
host = { workspace = true }
node = { workspace = true }
quinn = { workspace = true }
rand_core = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
state = { workspace = true }
statesync = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
fixture-awaiter = { path = "../kernel/fixtures/awaiter" }
fixture-egress = { path = "../kernel/fixtures/egress" }
fixture-oracle = { path = "../kernel/fixtures/oracle" }
fixture-programs = { path = "../kernel/fixtures/programs" }
fixture-probe = { path = "../kernel/fixtures/probe" }
fixture-relay = { path = "../kernel/fixtures/relay" }
fixture-valset = { path = "../kernel/fixtures/valset" }
fixture-wasm = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
