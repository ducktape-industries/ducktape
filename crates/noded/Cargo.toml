[package]
name = "noded"
edition.workspace = true
version.workspace = true

[dependencies]
abi = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
borsh = { workspace = true }
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
commonware-runtime = { workspace = true }
commonware-utils = { workspace = true }
consensus = { workspace = true }
futures = { workspace = true }
hex = "0.4"
host = { workspace = true }
node = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
state = { workspace = true }
statesync = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.24"
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
blobs = { workspace = true }
fixture-module-registry = { path = "../kernel/fixtures/module-registry" }
fixture-probe = { path = "../kernel/fixtures/probe" }
fixture-relay = { path = "../kernel/fixtures/relay" }
fixture-valset = { path = "../kernel/fixtures/valset" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
