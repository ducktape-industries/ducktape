[package]
name = "run-envelope"
edition.workspace = true
version.workspace = true

# The run envelope's SELF-IDENTIFYING MAGIC and the one headless composer that
# stamps it — the schema, with none of the machinery that acts on it.
#
# It is its own crate because the three programs that need this schema share
# nothing else. `compute-service` OWNS the envelope's reader, but reaching it
# means linking `provider-host` and with it the whole microVM sandbox — which a
# desktop GUI submitting a run must not do, and which is exactly what kept the
# app spawning `ducktape agent sched` instead of composing the payload itself.
#
# The dependency set is the point: serialization, never host machinery.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
