# The fast lane: what a push to `dev` proves in minutes. The `unit` job is
# required for PRs into `dev`. It also runs after a push to `dev` and on
# demand for a branch (`gh workflow run ci.yml --ref <branch>`).
#
# One job, one cache. `unit` restores one `target/` for everything the
# workspace compiles: clippy is check-mode over the workspace, and `--lib`
# runs every crate's unit tests.
#
# Everything heavier — the daemon suites over real sockets, the consensus
# simulation, the host against its programs — is `nightly.yml`.
name: ci

on:
  push:
    branches: [dev]
  # `unit` is a required check on dev, so it must also run on the PR head.
  pull_request:
    branches: [dev]
  workflow_dispatch:

# Runs queue per ref rather than cancel: a cancelled job saves no cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # rustc segfaults under load at the default job count on a shared runner.
  CARGO_BUILD_JOBS: 3

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest ships rustup; the checkout's rust-toolchain.toml pins
      # the exact channel + targets, so this just makes rustup install it.
      - run: rustup show
      - run: cargo test --locked --workspace --lib --no-fail-fast
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
