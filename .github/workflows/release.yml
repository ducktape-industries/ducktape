# Each time `main` moves, the self-hosted runners fabrics-1 (Linux x86_64) and
# mac-byeongsu (macOS arm64) build the ducktape binary and publish it on the
# prerelease bin-<commit>, one archive per platform.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/../target

jobs:
  bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: fabrics-1
            triple: x86_64-unknown-linux-gnu
          - runner: mac-byeongsu
            triple: aarch64-apple-darwin
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release -p node-bin
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bin-${{ github.sha }}
          ASSET: ducktape-${{ matrix.triple }}.tar.gz
          COPYFILE_DISABLE: 1 # keeps macOS tar from adding ._ducktape
        run: |
          tar czf "$ASSET" -C "$CARGO_TARGET_DIR/release" ducktape
          # Both runners may try to create the release; the loser finds it made.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease --latest=false --target "$GITHUB_SHA" --title "$TAG" \
            --notes "The ducktape node and CLI built at $GITHUB_SHA." \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$ASSET" --clobber
