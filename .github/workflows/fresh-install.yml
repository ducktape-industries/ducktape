name: fresh-install

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  acceptance:
    # Linux only: macOS runners are deliberately excluded (owner, 2026-09-20).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: run fresh-install acceptance
        run: bash ops/ci/fresh-install.sh
