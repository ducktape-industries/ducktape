# The proofs: every suite that boots a node. They take real runner time
# between them, so they run once a night against `dev` and on demand
# (`gh workflow run nightly.yml --ref <branch>`), never per push — `ci.yml`
# is the per-push lane.
#
# Two jobs, each a single sequential chain over ONE `target/`, so nothing is
# built twice and the crates they share compile into one cache.
#
# A `schedule` fires only from the repository's default branch and runs on
# that ref, so the cron checks out `dev` — the branch under test — by name; a
# dispatch checks out the ref it was dispatched on.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # rustc segfaults under load at the default job count on a shared runner.
  CARGO_BUILD_JOBS: 3

jobs:
  # The node proofs:
  #   - `noded`: the daemon suites, real nodes over localhost TCP — a
  #     validator serving its network, a late validator joining by state
  #     sync and catching up across epochs.
  #   - `consensus`: the simulated cluster — agreement, backfill, epoch
  #     boundaries, partitions, a validator epochs behind.
  #   - `statesync` and `node`: the join protocol and the mempool.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --locked -p noded -p consensus -p statesync -p node

  # The host against its guests, and the attested path:
  #   - the host suites run the committed fixture programs
  #     (crates/kernel/fixtures/wasm) through the real wasm runtime.
  #   - the attested path (crates/services/broker/src/attested.rs) only
  #     compiles under airlock's opt-in `verify` feature, which the default
  #     workspace build never enables, so it needs its own lint pass or it
  #     rots unnoticed.
  wasm-and-host:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --locked -p host -p runtime --tests
      - run: cargo clippy --locked -p broker-host -p provider-host --tests --no-deps --features broker-host/verify,provider-host/verify -- -D warnings
