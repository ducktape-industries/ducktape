# Each push to dev or main moves the same branch of duckpond's forge repository
# `core` forward, signed by account 22's "forge-sync CI" key. When forge already holds
# the push or has moved past it, the run changes nothing; when the two have diverged,
# the run posts in duckpond's #sync.
name: forge-sync

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORGE: duck://duckpond-725bcad1/forge/core
  FORGE_REPO: core
  CHAIN: duckpond-725bcad1
  NODE: https://duckpond.ducktape.industries
  CHANNEL: sync
  GIT_REMOTE_DUCK: https://github.com/ducktape-industries/ducktape/releases/download/git-remote-duck-7acf453/git-remote-duck-x86_64-unknown-linux-gnu
  GIT_REMOTE_DUCK_SHA256: c03d7b0d02327af0a1d8eef2d80e778ec8a67850aa42dd2b43022f85269b5b75
  DUCKTAPE_CLI: https://github.com/ducktape-industries/ducktape/releases/download/bin-6b7506194d68c4b6fd23c9e3b23a0d819e59585c/ducktape-x86_64-unknown-linux-gnu.tar.gz
  DUCKTAPE_CLI_SHA256: 4359bed0b846830eee7a53a62471795c915faba7387171ff9fa3dcd0693daebd
  DUCKTAPE_DEVICE_KEY_STORE: file

jobs:
  sync:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git-remote-duck
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/git-remote-duck" "$GIT_REMOTE_DUCK"
          echo "$GIT_REMOTE_DUCK_SHA256  $bin/git-remote-duck" | sha256sum -c -
          chmod +x "$bin/git-remote-duck"
          echo "$bin" >> "$GITHUB_PATH"
      - name: key
        env:
          KEY: ${{ secrets.DUCKPOND_FORGE_KEY }}
        run: |
          home="$RUNNER_TEMP/ducktape"
          mkdir -p "$home/git"
          (umask 077 && printf '%s' "$KEY" | base64 -d > "$home/git/$CHAIN.key")
          echo "DUCKTAPE_HOME=$home" >> "$GITHUB_ENV"
          git config --global "duck.$CHAIN.node" "$NODE"
      - name: push
        id: push
        run: |
          branch="refs/heads/$GITHUB_REF_NAME"
          head=$(git rev-parse HEAD)
          current=$(git ls-remote origin "$branch" | cut -f1)
          if [ "$current" != "$head" ]; then
            echo "::notice::GitHub's $GITHUB_REF_NAME has moved from $head to ${current:-nothing}; the run for that push syncs it."
            exit 0
          fi
          held=$(git ls-remote "$FORGE" "$branch" | cut -f1)
          if [ "$held" = "$head" ]; then
            exit 0
          fi
          if [ -n "$held" ]; then
            git fetch --quiet --no-tags "$FORGE" "+$branch:refs/forge/$GITHUB_REF_NAME"
          fi
          if [ -n "$held" ] && git merge-base --is-ancestor "$head" "$held"; then
            echo "::notice::forge's $GITHUB_REF_NAME is at $held, past $head."
            exit 0
          fi
          if [ -n "$held" ] && ! git merge-base --is-ancestor "$held" "$head"; then
            echo "::warning::GitHub's $GITHUB_REF_NAME at $head and forge's at $held have diverged."
            echo "forge=$held" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git push "$FORGE" "HEAD:$branch"; then
            exit 0
          fi
          now=$(git ls-remote "$FORGE" "$branch" | cut -f1)
          if [ "$now" != "$held" ]; then
            echo "::notice::forge's $GITHUB_REF_NAME moved to $now during the push."
            exit 0
          fi
          echo "::error::forge did not take $GITHUB_REF_NAME at $head; forge's $GITHUB_REF_NAME is ${held:-absent}. Nothing was overwritten."
          exit 1
      - name: ask forge-sync
        if: steps.push.outputs.forge != ''
        env:
          KEY: ${{ secrets.DUCKPOND_FORGE_KEY }}
          FORGE_HEAD: ${{ steps.push.outputs.forge }}
        run: |
          pip install --quiet pynacl==1.5.0
          cli="$RUNNER_TEMP/cli"
          mkdir -p "$cli"
          curl -fsSL -o "$cli/ducktape.tar.gz" "$DUCKTAPE_CLI"
          echo "$DUCKTAPE_CLI_SHA256  $cli/ducktape.tar.gz" | sha256sum -c -
          tar -xzf "$cli/ducktape.tar.gz" -C "$cli"
          export DUCKTAPE_PASSWORD=$(openssl rand -hex 24)
          export DUCKTAPE_USER_KEY="$DUCKTAPE_HOME/ci.key"
          (umask 077 && python3 - "$RUNNER_TEMP/ask.op" <<'PY'
          import base64, os, struct, sys
          from nacl.bindings import crypto_aead_xchacha20poly1305_ietf_encrypt
          from nacl.pwhash import argon2id
          from nacl.signing import SigningKey

          prefix = b"ducktape-user-key-v1:"
          seed = base64.b64decode(os.environ["KEY"])
          salt, nonce = os.urandom(16), os.urandom(24)
          kek = argon2id.kdf(32, os.environ["DUCKTAPE_PASSWORD"].encode(), salt, opslimit=3, memlimit=65536 * 1024)
          sealed = salt + struct.pack("<III", 65536, 3, 1) + nonce + bytes(SigningKey(seed).verify_key)
          sealed += crypto_aead_xchacha20poly1305_ietf_encrypt(seed, prefix, nonce, kek)
          with open(os.environ["DUCKTAPE_USER_KEY"], "w") as key:
              key.write(prefix.decode() + base64.urlsafe_b64encode(sealed).decode().rstrip("=") + "\n")

          def text(value):
              data = value.encode()
              return struct.pack("<I", len(data)) + data

          head, held, branch = os.environ["GITHUB_SHA"], os.environ["FORGE_HEAD"], os.environ["GITHUB_REF_NAME"]
          repo, forge = os.environ["GITHUB_REPOSITORY"], os.environ["FORGE_REPO"]
          message_id = f"forge-sync-ci-{forge}-{branch.replace('/', '-')}-{head[:12]}-{held[:12]}"
          line = f"GitHub {repo} {branch} is at {head} and forge {forge}'s {branch} at {held}: they have diverged. Forge wins: forge-sync resets GitHub's {branch} to {held}."
          span = text(line) + struct.pack("<I", 0)
          paragraph = b"\x00" + struct.pack("<I", 1) + span
          op = b"\x04" + text(os.environ["CHANNEL"]) + text(message_id) + struct.pack("<I", 1) + paragraph + b"\x00"
          with open(sys.argv[1], "wb") as out:
              out.write(op)
          PY
          )
          said=$("$cli/ducktape" --node "$NODE" submit chat "$RUNNER_TEMP/ask.op" --preconfirm)
          echo "$said"
          case "$said" in
            "preconfirmed applied"*|"preconfirmed rejected already_exists"*) ;;
            *) echo "::error::#$CHANNEL did not take the request: $said"; exit 1 ;;
          esac
