# Proves the "buildable on mac" half of the guest wasm toolchain claim on real
# Apple hardware: a blst-carrying guest builds to wasm32-unknown-unknown and
# componentizes with nothing but rustup, and NO wasm-capable clang. The
# mechanism under test is the module SDK's blst patch (build.rs early-returns
# on wasm32, so no C is compiled at all — see crates/module-sdk/stubs/blst/PATCH.md)
# plus the getrandom stubs beside it, which guest-builder patches into every
# synthesized shell workspace out of this repository. CC for the
# wasm target is pinned to /usr/bin/false so any attempt to compile C for
# wasm32 fails loudly rather than silently succeeding via a toolchain the
# runner happens to carry.
#
# On demand only (`gh workflow run guest-wasm-mac-smoke.yml --ref <branch>`):
# a push to any branch that touches the SDK must not spend a macOS runner.
name: guest-wasm-mac-smoke

on:
  workflow_dispatch:

concurrency:
  group: guest-wasm-mac-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CC_wasm32_unknown_unknown: /usr/bin/false
    steps:
      - uses: actions/checkout@v4

      - name: record toolchain evidence
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang --version | head -1
          brew list --versions llvm 2>/dev/null || echo "no brew llvm installed"

      - name: rustup (the checkout pins the channel and the wasm32 target)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # No `rustup default` / `rustup target add`: rust-toolchain.toml
          # overrides both inside the checkout. This first call installs the
          # pinned channel and its targets; -vV is the evidence of which.
          rustc -vV

      - name: build the identity guest via guest-builder (no C toolchain)
        run: |
          cargo run -p guest-builder -- crates/modules/system/identity \
            --scratch "$RUNNER_TEMP/identity-guest" \
            --out "$RUNNER_TEMP/identity.component.wasm"
          ls -l "$RUNNER_TEMP/identity-guest/target/wasm32-unknown-unknown/release/identity_component.wasm" \
            "$RUNNER_TEMP/identity.component.wasm"

      - name: assert blst dead-stripped
        # symbol names sit in the module as plain text (the name section,
        # imports, exports), so a byte scan of the core module sees every
        # reference the text form would.
        run: |
          count=$(grep -ac blst \
            "$RUNNER_TEMP/identity-guest/target/wasm32-unknown-unknown/release/identity_component.wasm" || true)
          echo "blst symbol refs in module: $count"
          test "$count" -eq 0
