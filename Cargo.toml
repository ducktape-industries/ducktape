# super-app workspace — a consensus platform of isolated modules. each module
# publishes its wire surface (types-only payload/query/reply shapes + codecs)
# at its crate root; cross-module product interaction goes through those wire
# types and host-mediated queries, never another module's internals.
# three layers: module / kernel / networking — the tree groups by function,
# not mechanism ("system" always means system *modules*). layout:
#   crates/kernel/   — the platform: host (submit/execute loop, root-hash
#                      composition, the host::worker seam), node (ordered
#                      replication), consensus (BFT orderer), statesync,
#                      recovery, indexer.
#   THE MODULE CONTRACT IS ANOTHER REPO — sdk, sdk-testkit, keyscheme,
#                      blobstore, wasm-host, module-artifact, node-work, the
#                      module SDK a guest port compiles against, the guest
#                      componentizer, every module's wire crate and the leaf
#                      types they share (git-primitives, duckdns, duckfs core
#                      and disk, run-envelope, view-wire, design) all live in
#                      ducktape-industries/ducktape-sdk and reach this
#                      workspace as git dependencies on its `dev` branch.
#   crates/networking/ — the netstack: transport infra ONLY (wireguard,
#                      nat-traversal, netstack-machine [the sans-I/O
#                      reachability decision core, its ducktape:netstack
#                      WIT world and the guest build of it],
#                      netstack-scenarios [the frozen scenario suite and
#                      golden traces every backend is held to],
#                      netstack-wasm [the wasmtime embedding of that
#                      world], reachability [the host executor + rendezvous
#                      runtime], data-plane, overlay-net) — owns no
#                      consensus module
#   crates/modules/   — CONSENSUS MODULES AND NOTHING ELSE. every crate under
#                      system/ or apps/ implements `sdk::Module`; anything that
#                      does not belongs somewhere else in this list. (module =
#                      onchain, service = offchain.)
#   crates/modules/system/ — system modules: consensus infrastructure (acl,
#                      kv, valset, governance, identity, modules, saga,
#                      capability, dispatch, attribution, gateway — which
#                      embeds the `duckdns` naming library it consumes from
#                      ducktape-sdk)
#   crates/modules/apps/   — application modules. core builds forge and files
#                      from source; chat, pages, agent, runs, tasks, boards,
#                      automations, inbox and collaboration ship from
#                      ducktape-industries/ducktape-modules, and core keeps
#                      only their committed `<id>.component.wasm` /
#                      `index.wasm` / `guest.lock` under apps/<id>/, which
#                      crates/noded/build.rs stages by path
#   crates/services/ — off-chain service crates: the host-side executors that
#                      serve a consensus module without being one (compute —
#                      the dispatch WorkSpec pool/ledger/gate; sandbox — the
#                      microVM/egress/backend-probe muscle; broker —
#                      the run-scoped credential loopback + airlock client;
#                      provider — the executor spec layer + CliProvider run loop;
#                      agent — the pty session daemon; airlock — the lender;
#                      media — the huddle voice/video planes + call-socket wire;
#                      files-odb / forge-odb — the disk odb a wasm files or
#                      forge tenant commits through, so neither module names
#                      a kernel host)
#   crates/topology/ — the module composition catalog: the id universe, its
#                      shape/config schema and the named genesis selections
#                      every composer draws from (pure data, no deps)
#   crates/airlock/  — the two-party execution/auth contract (see members below)
#   crates/duckfs/client/ — the OS-side duckfs client. The engine it speaks to
#                      (duckfs-core, duckfs-disk) ships from ducktape-sdk.
#   crates/testing/  — dev-only shared test support (nettest: raw-http client,
#                      port allocation, poll; source-lint: which files and items
#                      hold shipped code, for the repo-wide source lints).
#                      [dev-dependencies] of the bin
#                      integration suites ONLY; no shipping crate depends on it
#   crates/labs/     — quarantined experimental consensus modules (evm,
#                      multisig): in-tree and tested but registered by NO
#                      genesis set. EXCLUDED from the workspace as its own
#                      standalone crate so its heavy deps (revm, alloy) never
#                      tax the shipping build; gated via `make labs-gate`
#   crates/noded/    — the node daemon library: the /v1 http+ws surface, the
#                      actor lane, index/blob/stream lanes and the in-process
#                      testkit — served by bin/noded, bin/node and bin/simnode
#   bin/             — node (the `ducktape`
#                      CLI: validator + fs verbs + mcp server), noded (the
#                      app-facing daemon process), simnode (deterministic /v1
#                      twin), coordinator (STUN rendezvous), node-launcher
#                      (the node's supervisor) and the service binaries
# the host dispatches modules over BFT consensus and composes each authenticated
# root into the global root-hash. cosmwasm's isolation *pattern*, native rust.

[workspace]
resolver = "2"
members = [
    # kernel — the platform (contract + dispatch + transport + BFT ordering).
    # The module contract itself (`sdk`, `sdk-testkit`, `index-guest`,
    # `keyscheme`, `blobstore`, `wasm-host`, `module-artifact`, `node-work`)
    # lives in ducktape-sdk and reaches this workspace as a git dependency.
    "crates/kernel/host",
    "crates/kernel/node", "crates/kernel/consensus",
    "crates/kernel/statesync", "crates/kernel/recovery", "crates/kernel/indexer",
    # networking — the netstack (host-side infra + the modules that govern it)
    "crates/networking/wireguard",
    "crates/networking/nat-traversal",
    "crates/networking/netstack-machine",
    "crates/networking/netstack-scenarios",
    "crates/networking/netstack-wasm",
    "crates/networking/reachability",
    "crates/networking/data-plane",
    "crates/networking/overlay-net",
    # modules/system — system modules. every entry implements `sdk::Module`.
    # Their wire crates live in ducktape-sdk (git dependency).
    "crates/modules/system/acl",
    "crates/modules/system/kv",
    "crates/modules/system/valset",
    "crates/modules/system/governance",
    "crates/modules/system/identity",
    "crates/modules/system/modules",
    "crates/modules/system/saga",
    "crates/modules/system/capability",
    "crates/modules/system/dispatch",
    "crates/modules/system/attribution",
    "crates/modules/system/gateway",
    # airlock — the two-party execution/auth contract. NOT a consensus module
    # (no MODULE_ID, no guest wasm): a protocol shared by the lender service,
    # the borrower broker and the enclave binary, so it sits beside the other
    # cross-plane protocol families rather than under any one party.
    "crates/airlock",
    "crates/authpage",
    # keystore — the device keystore (`keys/<name>.key` + the active pointer)
    # and the argon2id/AEAD seal under it. Same standing, same reason: its two
    # consumers are the CLI and the desktop app, which share nothing else. It
    # sat inside bin/node until the app's only route to it was spawning
    # `ducktape` over pipes, making "can the app find a binary?" a precondition
    # for opening your own key.
    "crates/keystore",
    # A workspace on disk (identity, network.toml, node.toml, the invite codec)
    # and the join ceremony that writes one. Split from bin/node because
    # joining is the one node operation with no running node to ask.
    "crates/workspace-config",
    # THE ducktape home resolution, alone in a zero-dependency leaf so the
    # light services can read it without workspace-config's graph behind it.
    "crates/ducktape-home",
    "crates/duckfs/client",
    "crates/rpc-client",
    # the desktop app's self-update state machine + release-manifest verify,
    # pure (no I/O): driven by the launcher at boot and by the app while running.
    "crates/app-update",
    # apps — the two product modules core still builds from source. The rest
    # (chat, pages, agent, runs, tasks, boards, automations, inbox,
    # collaboration) live in ducktape-modules; core keeps only their committed
    # artifacts under crates/modules/apps/<id>/, which crates/noded/build.rs
    # stages into the founding set by path.
    "crates/modules/apps/forge",
    "crates/modules/apps/files",
    # services — off-chain host-side executors
    "crates/services/agent",
    "crates/services/airlock",
    "crates/services/broker",
    "crates/services/compute",
    "crates/services/files-odb",
    "crates/services/forge-odb",
    "crates/services/mcp",
    "crates/services/media",
    "crates/services/provider",
    "crates/services/sandbox",
    # testing — dev-only shared harness helpers (raw-http client, ports,
    # poll; and the source lints' shared "is this shipped code" judgement).
    # NOT a Module Rule surface; no shipping crate depends on it.
    "crates/testing/nettest", "crates/testing/source-lint",
    # topology — the module composition catalog every composer draws from
    "crates/topology",
    # noded — the daemon library behind the /v1 surface
    "crates/noded",
    # bin — runnable binaries
    "bin/node", "bin/noded", "bin/simnode", "bin/coordinator",
    "bin/airlock-gateway",
    "bin/media-service",
    "bin/forge-service",
    "bin/terminal-service",
    "bin/duck-guest-init",
    # the node's supervisor: the same machine, holding the flip for the
    # network's governance-designated activation height
    "bin/node-launcher",
]
# labs is a standalone crate (its own [workspace] + Cargo.lock), NOT a member:
# its quarantined evm/multisig deps (revm, alloy) must never enter — or slow —
# the shipping workspace build. It stays in-tree and is gated via `make labs-gate`.
exclude = ["crates/labs"]

# how this workspace names itself to `guest-builder` (ducktape-sdk). A guest is
# built out of the PLATFORM REPOSITORY at a revision, never out of the working
# tree: the builder synthesizes a scratch workspace whose module dependency is
# this git url pinned to a commit, so the url has to come from the platform
# itself rather than from whoever runs the build.
[workspace.metadata.guest-builder]
platform = "https://github.com/ducktape-industries/ducktape"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# the host<->wasm-view wire. `manifest` is host-only (it pulls wasmparser to
# read a built component's custom section); the guests take it bare.
# It lives in ducktape-sdk now, with the rest of the module/view contract.
view-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "view-wire" }
# the ducktape CLI's argument grammar (derive). already in the graph
# transitively, so this costs no new compilation unit.
clap = { version = "4.6", features = ["derive"] }
# the logging facade. events land in `noded::LogRing` (streamed to the app's
# Logs tab over the ws `logs` topic) AND on stderr (tee'd to daemon.log) —
# both gated by ONE reloadable filter, see crates/noded/src/log.rs.
tracing = "0.1"
arrayvec = "0.7"
crossbeam-channel = "0.5"
lru = "0.18"
# rlimit/mallopt syscalls: the open-file raise every binary makes at startup.
libc = "0.2"
smallvec = "1"
sha2 = "0.10"
# release archives (`.tar.zst`): bin/node-launcher stages a node release out
# of one, and airlock's `codesign` lane packs a signing request into one.
tar = "0.4"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# revm + alloy-primitives are NOT here on purpose: they are quarantined as
# direct pinned deps in crates/labs/Cargo.toml (the standalone labs crate), so
# the shipping workspace never builds the EVM dep tree. See labs-gate.
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
rand = "0.8"
# Opus codec (voice) — pure Rust, no C toolchain. No FEC-decode / PLC in the
# decoder (empty input errors), so the voice engine renders lost frames as
# silence; see crates/services/media.
opus-rs = "0.1"

# commonware — one ecosystem, version-aligned (see auto-memory reference_qmdb_commonware).
commonware-storage = "2026.9.0"
commonware-runtime = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
# the simplex BFT stack — used by the `consensus` crate (the real orderer);
# pinned here so every commonware crate stays on the one version.
commonware-consensus = "2026.9.0"
commonware-resolver = "2026.9.0"
commonware-p2p = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-utils = "2026.9.0"
commonware-actor = "2026.9.0"
# the userspace overlay backend (overlay-net/userspace): the BoringTun noise
# core used sans-io (`noise::Tunn`, no device layer) — WireGuard-compatible on
# the wire by construction.
defguard_boringtun = "0.6.5"
# tests only: forging a WireGuard mac1 the way boringtun's rate limiter
# computes it (blake2s keyed by HASH(LABEL_MAC1 || responder public)). the
# helpers are `pub(crate)` in boringtun, and this is the same blake2 build its
# own handshake code links.
blake2 = "0.10"
# the userspace backend's virtual host: a TUN-less TCP/UDP stack terminating
# at the node's overlay ULA, entirely in-process. `medium-ip` because the
# tunnel carries raw IP (WireGuard has no link layer), `async` for the
# waker-based socket surface.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ip", "proto-ipv6", "socket-udp", "socket-tcp", "async",
] }
# the node's own WireGuard identity is X25519 (WireGuard's curve, not the
# ed25519 signer's); static_secrets because the key persists across boots.
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
p256 = "0.13"
# secp256k1 with public-key RECOVERY: an Ethereum wallet's `personal_sign`
# proof carries r‖s‖v and no pubkey, so verify = recover + compare.
k256 = { version = "0.13", features = ["ecdsa"] }
# raw (un-namespaced) ed25519 for OpenSSH `SSHSIG` verification — an SSH
# key signs the SSHSIG blob directly, never commonware's namespaced preimage.
ed25519-dalek = "2"
# keccak-256 for the EIP-191 personal-message digest.
sha3 = "0.10"
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"
# tests only: isolated on-disk module data dirs.
tempfile = "3"
# user-key v1 at-rest custody (crates/keystore/src/userkey.rs only): BIP39
# wordlist + entropy checksum (the PBKDF2 `to_seed` path is deliberately
# unused — see the identity-onboarding design doc's custody model),
# argon2id KEK derivation, and XChaCha20-Poly1305 AEAD. zeroize scrubs the
# derived key on drop.
bip39 = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"

# fluent31 — the derived read-model engine (LSM + MVCC snapshots) behind the
# per-module indexer tier ONLY: nothing the root-hash commits to may live in
# it. Every fluent31 database is a rebuildable projection of the op feed, never
# a canonical substrate.
# default-features = false keeps the base dep lean; the indexer crate turns the
# `wasm` feature on — the in-database WASM layer (wasmtime) runs the per-module
# index guests (fold triggers + view queries).
fluent31 = { git = "https://github.com/orthory/fluent31", rev = "76ba1867bc0ba9c09bb8387149c07844f1d2395c", default-features = false }
# fluent-guest — fluent31's wasm32 guest SDK. NEVER a host-side dependency:
# only the index-guest crate's `guest` feature pulls it, and only guest-builder's
# synthesized wasm32 shells ever enable that feature. It is compiled INTO
# every committed index guest, so moving this rev moves their bytes: rebuild
# each `index.wasm` (`guest-builder --index`, the Makefile's INDEX_MODULES)
# and run `make wasm-rebuild-check` in the same change.
fluent-guest = { git = "https://github.com/orthory/fluent31", rev = "76ba1867bc0ba9c09bb8387149c07844f1d2395c", default-features = false }
# borsh — the deterministic op-row envelope on the derived tier's fold feed
# (host encodes, index guests decode; one byte layout, no map ordering games).
borsh = { version = "1", default-features = false, features = ["derive", "std"] }

# wasmtime — the frozen-substrate wasm runtime that executes hot-swappable
# modules inside the host. pinned EXACTLY: the runtime IS the module execution
# semantics, so it is consensus-affecting and every validator must run the
# identical build; changing it is a binary upgrade, never a live module swap.
wasmtime = "=46.0.3"
# wit-bindgen — the guest-side binding generator for a crate's own component
# port (the netstack machine's `guest` feature). Only ever compiled inside
# guest-builder's synthesized wasm32 workspace.
wit-bindgen = "0.57"

# internal — kernel crates (the platform)
#
# THE MODULE CONTRACT IS ANOTHER REPO. `sdk`, the module SDK a guest compiles
# against, the wasm host that runs one, and the leaf types they share all live
# in ducktape-industries/ducktape-sdk and reach this workspace as git
# dependencies on its `dev` branch. Consumers keep `{ workspace = true }`.
sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "sdk" }
# the module SDK a guest port compiles against. wasm-only: every module's
# `guest` feature turns it on, and only guest-builder's shell workspace does.
ducktape-module-sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "ducktape-module-sdk" }
keyscheme = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "keyscheme" }
# dev-only shared test doubles for the sdk boundary traits (TestCtx +
# in-memory MerkleStore). MAY ONLY appear in `[dev-dependencies]` of consumers —
# the Module Rule (modules link only sdk + wire surfaces) is untouched.
sdk-testkit = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "sdk-testkit" }
host = { path = "crates/kernel/host" }
node = { path = "crates/kernel/node" }
consensus = { path = "crates/kernel/consensus" }
statesync = { path = "crates/kernel/statesync" }
recovery = { path = "crates/kernel/recovery" }
indexer = { path = "crates/kernel/indexer" }
blobstore = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "blobstore" }
# keyed with the underscore ON PURPOSE: module crates declare a feature named
# `index-guest` (the guest-builder --index contract), and cargo refuses a
# feature sharing its name with a non-optional dependency key.
index_guest = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "index-guest" }
wasm-host = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "wasm-host" }
module-artifact = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "module-artifact" }
node-work = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "node-work" }
# per-module materialized views on the derived tier (indexer + the module's
# types-only interface crate — never the module impl).
# internal — module impl crates
# A MODULE'S NAME RESOLVES TO ITS WIRE CRATE. `identity = { workspace = true }`
# links `identity-wire` — the types and codecs — under the name `identity`, so
# the kernel, the daemon, a service, a view and a sibling module all speak a
# module's format without linking the module. Nothing outside `crates/modules`
# links a module crate itself except a test that runs the native module (a
# parity suite), and that names it by path, never through this table:
# `crates/topology/tests/sdk_shaped.rs` holds the line.
# EVERY WIRE CRATE LIVES IN ducktape-sdk. The names below are unchanged, so a
# consumer still writes `identity = { workspace = true }` and still links
# `identity-wire`; only where the bytes come from moved.
kv = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "kv-wire" }
kv-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "kv-wire" }
acl = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "acl-wire" }
acl-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "acl-wire" }
valset = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "valset-wire" }
valset-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "valset-wire" }
governance = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "governance-wire" }
governance-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "governance-wire" }
identity = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "identity-wire" }
identity-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "identity-wire" }
modules = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "modules-wire" }
modules-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "modules-wire" }
saga = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "saga-wire" }
saga-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "saga-wire" }
capability = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "capability-wire" }
capability-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "capability-wire" }
dispatch = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "dispatch-wire" }
dispatch-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "dispatch-wire" }
attribution = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "attribution-wire" }
attribution-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "attribution-wire" }
gateway = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "gateway-wire" }
gateway-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "gateway-wire" }
forge = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "forge-wire" }
forge-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "forge-wire" }
design = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "design" }
pages = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "pages-wire" }
pages-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "pages-wire" }
chat = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "chat-wire" }
chat-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "chat-wire" }
chat-message = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "chat-message" }
agent = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "agent-wire" }
agent-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "agent-wire" }
runs = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "runs-wire" }
runs-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "runs-wire" }
tasks = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "tasks-wire" }
tasks-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "tasks-wire" }
boards = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "boards-wire" }
boards-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "boards-wire" }
automations = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "automations-wire" }
