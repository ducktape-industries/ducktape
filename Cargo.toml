# ducktape — a BFT-replicated sandbox for wasm programs. layout:
#   crates/kernel/     — the platform: abi (the bytes ABI programs and hosts
#                        share), guest (what a program compiles against),
#                        runtime (the wasmtime embedding), state (the
#                        authenticated store and its commitments), blobs (one
#                        content-addressed store), host (the sandbox: submit,
#                        query, deliver), node (frames, blocks, the mempool),
#                        consensus (simplex BFT over marshal, per-epoch
#                        engines, catch-up), statesync (a joiner adopts a
#                        network's state); fixtures/ is its own workspace of
#                        wasm32 test programs
#   crates/noded/      — the daemon library: the /v1 http+ws surface, the
#                        lookup mesh, the workspace on disk, the client
#   bin/node           — the `ducktape` binary: the node and its CLI
#   crates/networking/ — the netstack: transport infra ONLY (wireguard,
#                        nat-traversal, netstack-machine, netstack-scenarios,
#                        netstack-wasm, lane-wasm, reachability, data-plane,
#                        overlay-net)
#   crates/services/   — off-chain service crates: provider, sandbox, broker,
#                        agent, airlock, media, mcp
#   crates/airlock/    — the two-party execution/auth contract
#   crates/testing/    — dev-only shared test support (nettest)
#   bin/               — coordinator (STUN rendezvous), airlock-gateway,
#                        media-service, terminal-service, duck-guest-init

[workspace]
resolver = "2"
members = [
    "crates/kernel/abi",
    "crates/kernel/guest",
    "crates/kernel/runtime",
    "crates/kernel/state",
    "crates/kernel/blobs",
    "crates/kernel/host",
    "crates/kernel/node",
    "crates/kernel/consensus",
    "crates/kernel/statesync",
    "crates/noded",
    "crates/modules/wire",
    "crates/networking/wireguard",
    "crates/networking/nat-traversal",
    "crates/networking/netstack-machine",
    "crates/networking/netstack-scenarios",
    "crates/networking/netstack-wasm",
    "crates/networking/lane-wasm",
    "crates/networking/reachability",
    "crates/networking/data-plane",
    "crates/networking/overlay-net",
    "crates/airlock",
    "crates/keystore",
    "crates/ducktape-home",
    "crates/rpc-client",
    "crates/app-update",
    "crates/services/agent",
    "crates/services/airlock",
    "crates/services/broker",
    "crates/services/media",
    "crates/services/mcp",
    "crates/services/provider",
    "crates/services/sandbox",
    "crates/testing/nettest",
    "bin/coordinator",
    "bin/node",
    "bin/airlock-gateway",
    "bin/media-service",
    "bin/terminal-service",
    "bin/duck-guest-init",
]
exclude = ["crates/kernel/fixtures", "crates/modules/system"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# the ducktape CLI's argument grammar (derive). already in the graph
# transitively, so this costs no new compilation unit.
clap = { version = "4.6", features = ["derive"] }
# the logging facade. events land in the ring `noded::Logs` serves at
# `/v1/logs` AND on stderr — both gated by ONE reloadable filter, see
# crates/noded/src/logs.rs.
tracing = "0.1"
arrayvec = "0.7"
crossbeam-channel = "0.5"
lru = "0.18"
# rlimit/mallopt syscalls: the open-file raise every binary makes at startup.
libc = "0.2"
smallvec = "1"
sha2 = "0.10"
# release archives (`.tar.zst`): airlock's `codesign` lane packs a signing
# request into one.
tar = "0.4"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
rand = "0.8"
# Opus codec (voice) — pure Rust, no C toolchain. No FEC-decode / PLC in the
# decoder (empty input errors), so the voice engine renders lost frames as
# silence; see crates/services/media.
opus-rs = "0.1"

# commonware — one ecosystem, version-aligned (see auto-memory reference_qmdb_commonware).
commonware-storage = "2026.9.0"
commonware-runtime = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
# the simplex BFT stack — used by the `consensus` crate (the real orderer);
# pinned here so every commonware crate stays on the one version.
commonware-consensus = "2026.9.0"
commonware-p2p = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-utils = "2026.9.0"
commonware-actor = "2026.9.0"
# the userspace overlay backend (overlay-net/userspace): the BoringTun noise
# core used sans-io (`noise::Tunn`, no device layer) — WireGuard-compatible on
# the wire by construction.
defguard_boringtun = "0.6.5"
# tests only: forging a WireGuard mac1 the way boringtun's rate limiter
# computes it (blake2s keyed by HASH(LABEL_MAC1 || responder public)). the
# helpers are `pub(crate)` in boringtun, and this is the same blake2 build its
# own handshake code links.
blake2 = "0.10"
# the userspace backend's virtual host: a TUN-less TCP/UDP stack terminating
# at the node's overlay ULA, entirely in-process. `medium-ip` because the
# tunnel carries raw IP (WireGuard has no link layer), `async` for the
# waker-based socket surface.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ip", "proto-ipv6", "socket-udp", "socket-tcp", "async",
] }
# the node's own WireGuard identity is X25519 (WireGuard's curve, not the
# ed25519 signer's); static_secrets because the key persists across boots.
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"
# tests only: isolated on-disk module data dirs.
tempfile = "3"
# user-key v1 at-rest custody (crates/keystore/src/userkey.rs only): BIP39
# wordlist + entropy checksum (the PBKDF2 `to_seed` path is deliberately
# unused — see the identity-onboarding design doc's custody model),
# argon2id KEK derivation, and XChaCha20-Poly1305 AEAD. zeroize scrubs the
# derived key on drop.
bip39 = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"

# fluent31 — the LSM engine under the state crate's storage.
fluent31 = { git = "https://github.com/ducktape-industries/fluent31", rev = "76ba1867bc0ba9c09bb8387149c07844f1d2395c", default-features = false }
# borsh — the record codec: the ABI, the wire records and the workspace files
# share one byte layout with no map ordering games.
borsh = { version = "1", default-features = false, features = ["derive", "std"] }

# wasmtime — the wasm runtime that executes a network's programs inside the
# host. pinned EXACTLY: the runtime IS the program execution semantics, so it
# is consensus-affecting and every validator must run the identical build;
# changing it is a binary upgrade, never a live program swap.
wasmtime = "=46.0.3"
# wit-bindgen — the guest-side binding generator for the netstack machine's
# own component port (its `guest` feature), compiled only on wasm32.
wit-bindgen = "0.57"

# internal — kernel crates (the platform), and the two leaves the services
# and the node still take from ducktape-industries/ducktape-sdk on its `dev`
# branch: `sdk` (the services' module types) and `keyscheme` (the key schemes
# a frame's signer may use).
sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "sdk" }
keyscheme = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "keyscheme" }
abi = { path = "crates/kernel/abi" }
guest = { path = "crates/kernel/guest" }
runtime = { path = "crates/kernel/runtime" }
state = { path = "crates/kernel/state" }
blobs = { path = "crates/kernel/blobs" }
host = { path = "crates/kernel/host" }
node = { path = "crates/kernel/node" }
consensus = { path = "crates/kernel/consensus" }
statesync = { path = "crates/kernel/statesync" }
# internal — the system programs' contracts: the ops, queries and replies
# every party speaks to them (the programs themselves are the wasm32
# workspace at crates/modules/system, built by `make system-programs`).
wire = { path = "crates/modules/wire" }
# internal — off-chain service crates
agent-service = { path = "crates/services/agent" }
airlock-service = { path = "crates/services/airlock" }
broker-host = { path = "crates/services/broker" }
mcp-host = { path = "crates/services/mcp" }
media-service = { path = "crates/services/media" }
provider-host = { path = "crates/services/provider" }
sandbox-host = { path = "crates/services/sandbox" }
# internal — cross-plane libraries: neither kernel nor service.
# duckdns is the `.duck` naming library the terminal service validates names
# through.
duckdns = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duckdns" }
# the device keystore, linked by both the CLI and the desktop app.
keystore = { path = "crates/keystore" }
# the run envelope's magic + headless composer, linked by the provider
# service and the desktop app.
run-envelope = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "run-envelope" }
# the app's update state machine, manifest + minisign verify and state.json
# codec, shared with the desktop app.
app-update = { path = "crates/app-update" }
# `$DUCKTAPE_HOME` else `~/.ducktape`, resolved once for every reader of it.
ducktape-home = { path = "crates/ducktape-home" }
# the daemon library the `ducktape` binary runs.
noded = { path = "crates/noded" }
duckfs-core = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duckfs-core" }
ducktape-rpc = { path = "crates/rpc-client" }
# internal — networking crates
wireguard = { path = "crates/networking/wireguard" }
# default-features off at the workspace level: the `runtime` feature (sockets,
# clocks) is opted into by the host-side consumers below; the netstack
# machine takes the pure wire surface only, natively and on wasm32.
nat-traversal = { path = "crates/networking/nat-traversal", default-features = false }
netstack-machine = { path = "crates/networking/netstack-machine" }
netstack-scenarios = { path = "crates/networking/netstack-scenarios" }
netstack-wasm = { path = "crates/networking/netstack-wasm" }
lane-wasm = { path = "crates/networking/lane-wasm" }
reachability = { path = "crates/networking/reachability" }
data-plane = { path = "crates/networking/data-plane" }
overlay-net = { path = "crates/networking/overlay-net" }

# overlay-net's wrapper context implements commonware-runtime's `Clock` and
# rng bounds, whose supertraits live in these crates — pinned to the exact
# versions commonware-runtime 2026.9.0 depends on (a different semver-major
# would be a different trait). airlock pins its own rand_core 0.6 for the
# dalek curves, which have not moved.
governor = "0.10.2"
rand_core = "0.10.1"

# dev/test builds compile wasm guests through cranelift (the fixture programs
# in the kernel tests). unoptimized
# cranelift is 10-30x slower — enough that a fleet of e2e daemons booting
# concurrently blows readiness deadlines — so the code generator itself is
# always built optimized. build-time only; artifacts and semantics unchanged.
# Native build scripts are optimized independently from application code.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

# The sign-in unlock, and every signed write after it, runs one argon2id pass
# over a 64 MiB buffer (`crates/keystore/src/userkey.rs` DEFAULT_M_KIB) — the KDF is
# SUPPOSED to be expensive, but only at its release speed. Unoptimized it is
# ~15x that: an unoptimized unlock measured 1.85 s per derivation on this
# box, against 0.00 s for the process spawn. That is the whole of the "sign-in takes
# forever" report, and it taxes every `user sign-frame` too. Same params, same
# algorithm — this only compiles the memory-fill loop properly.
[profile.dev.package.argon2]
opt-level = 3

# The huddle's per-frame video codecs. Every captured frame pays an MJPEG
# decode (mozjpeg's C, whose cc build inherits this profile's OPT_LEVEL) or a
# YUYV conversion (nokhwa-core), a JPEG encode, and every peer frame a JPEG
# decode — 25 times a second each. Unoptimized, a VGA encode runs ~25 ms, a
# decode ~44 ms and the channel swap ~24 ms, and the capture loop falls behind
# the camera: the "huddle video latency" report under `make dev`.
#
# The pure-Rust codecs (jpeg-encoder, zune-jpeg) are GENERIC over their writer
# and reader, so their entry points and everything inlined into them
# instantiate in the crate that CALLS them — an override on the codec
# packages alone left the app's O0 copy doing the work. That caller is
# media-service (`video::codec`, non-generic entry points), optimized here so
# the app crate stays at opt-level 0 and never touches a pixel loop; the codec
# packages stay optimized too for the non-generic internals (IDCT, Huffman)
# that are compiled in their own crate.
[profile.dev.package.media-service]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3
