# fetch git dependencies (fluent31) with the git CLI instead of
# libgit2: a `url.insteadOf` rewrite to ssh breaks cargo's built-in fetcher,
# while the real git binary picks up the usual ssh agent/keys.
[net]
git-fetch-with-cli = true

# tokio's unstable taskdump API (`Handle::dump()`, the SIGUSR1 task dump in
# bin/node/src/task_dump.rs) needs this cfg. Linux only, matching the target
# table in bin/node/Cargo.toml that turns the `taskdump` feature on: tokio
# refuses that feature on any other OS, and a macOS build must stay a plain
# stable-tokio build. wasm32 programs are outside `target_os = "linux"` too, so
# a program's bytes never see this flag.
[target.'cfg(target_os = "linux")']
rustflags = ["--cfg", "tokio_unstable"]
