[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false
description = "A local-first consensus workspace for people and agents"
authors = ["Ducktape contributors"]

[dependencies]
gpui-kit = { version = "=0.6.1", features = ["tree-sitter-languages"] }
# the pages document editor: Notion-shaped blocks, marks, slash menu and
# toolbar on the same gpui-kit; the guest keeps the markdown canonical.
gpui-notion = { path = "../crates/gpui-notion" }
unicode-segmentation = "1"
qrcode = { version = "0.14", default-features = false }
futures.workspace = true
pulldown-cmark = "0.12.2"
# chat's CLIENT view model: the block parse a composer's text goes through
# and the account link a mention spells. One implementation, whether the
# reader of it is this app or the chat view.
chat.workspace = true
# the huddle media planes: the call-socket framing and voice/video wire.
media-service.workspace = true
design.workspace = true
ducktape-rpc.workspace = true
# the desktop app's self-update machine; `backend/update.rs` is its executor.
app-update.workspace = true
tar.workspace = true
zstd.workspace = true
module-artifact.workspace = true
# the `b64` pages the node's read lane answers with
base64.workspace = true
sha2.workspace = true
# the blob read lane's own bounds and reply shape: a page size spelled here
# as a literal would be a second copy the module cannot see move.
forge.workspace = true
gateway.workspace = true
# the client-computed merge lane: a bare mirror fetched over the node's
# /forge/{repo} smart-HTTP bridge + the scratch merge commit MergePr CASes.
# forge's exact pin (vendored, no TLS transports — the bridge speaks plain
# http on loopback/LAN; probed against a live node before adoption).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# THE ducktape home resolution (`$DUCKTAPE_HOME` else `~/.ducktape`), in a
# zero-dependency leaf so every reader of that root agrees about it.
ducktape-home.workspace = true
identity.workspace = true
# THE device keystore, linked rather than spawned. Opening your own key is the
# app's own business: it used to reach argon2id by starting `ducktape` and
# piping to it, which made "can this process find a binary on disk?" a
# precondition for unlocking a wallet — and the sentence a person got when it
# could not was about checking their install.
keystore.workspace = true
# the signed op frame `/v1/submit/frame` takes. Signing one is the other half
# of holding the key in-process; `node::encode_frame` is the ONE encoder, and a
# second implementation of a machine wire format is not a thing to write.
node.workspace = true
authpage.workspace = true
# the ed25519 signer `keystore` hands back and `node::encode_frame` signs with.
commonware-cryptography.workspace = true
# the run envelope a durable agent run is scheduled with — the SCHEMA only.
# Reaching the composer through `compute-service` would link provider-host
# and the microVM sandbox into a GUI.
run-envelope.workspace = true
# the 32 random bytes of a fresh dispatch id.
rand.workspace = true
# Consensus payloads and authenticated origin types used by signed writes.
sdk.workspace = true
# The join ceremony, linked rather than spawned. Joining is the one node
# operation with no daemon to ask — it is what BRINGS a workspace into
# existence — so the app runs it here instead of shelling out to
# `ducktape node join` and diffing the workspace registry to find out which
# directory the child had created.
workspace-config.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The huddle's media leg (`src/call.rs`): microphone/speaker streams and the
# `/v1/call/ws` socket the node's call hub serves.
cpal = "0.15"
tokio-tungstenite = "0.24"
# The camera leg (`src/video.rs`): capture. The JPEG codec it feeds is
# `media_service::video::codec`, deliberately NOT a dep here (see that module).
nokhwa = { version = "0.10", features = ["input-native"] }
# The picture viewer (`src/backend/picture.rs`) decodes to RGBA off-thread;
# GPUI receives the decoded pixels.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The same viewer validates and measures an SVG before native rendering.
usvg = "0.45"
# A web picture in forge Markdown is one capped GET (`web_picture_bytes`);
# the workspace's reqwest is already in the binary under rpc-client.
reqwest.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
# The app's own diagnostics: `main.rs` installs ONE subscriber over
# `<DUCKTAPE_HOME>/app.log` (rotated at open by `node::log_file`, the same
# opener as the node's daemon.log) plus a panic hook that lands there. Every
# failure a person must act on is still a plate on screen; the file is what a
# member attaches to an issue when the plate is not enough.
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# the device key's name is the host's (`device_key_name`); a kernel call
# works on every OS the app runs on.
gethostname = "1"
zeroize.workspace = true
# The module-owned views (`src/module_view.rs`): the wire a view's tree and
# events cross on, and the runtime that executes the view's component. The
# same wasmtime pin as the node — a view is not consensus, but one runtime
# in one binary is one set of semantics to reason about.
view-wire = { workspace = true, features = ["manifest"] }
wasmtime.workspace = true

# The native notification leg (`src/backend/notify.rs`): being @mentioned or
# DM'd raises a real desktop banner, not just the in-app bell, through
# whichever notifier the host offers. On macOS that is the notification
# center: objc2 0.5 is already in this binary's graph under winit — these only
# turn on the classes the file names. UNUserNotificationCenter TERMINATES a
# process with no bundle identifier, so `notify` reads NSBundle first and a
# bare binary (every `cargo test`) degrades to a debug! line.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
# The screen-share leg (`src/video.rs`): the main display through
# `CGDisplayCreateImage`. Already in this binary's graph under gpui.
core-graphics = "0.24"
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationTrigger"] }

# Everywhere else the notifier is the freedesktop notifications service, one
# `Notify` call on the session bus. zbus is already in this binary's graph
# under the accessibility stack; this only names it.
[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus = "5"
# The screen-share leg (`src/video.rs`): a root-window grab over X11. Already
# in this binary under winit, and pure Rust — the portal/pipewire route would
# put a build-time system library on every machine that builds this app. A
# Wayland session's X root holds X clients only, so the share refuses there
# rather than grab a black desktop (`ScreenSource::open`).
# `composite` for the window shares: an unredirected window cannot be named as
# a pixmap, and reading the window drawable itself returns undefined bytes
# wherever something overlaps it. `randr` (the heads) and `xfixes` (the pointer)
# are already on through gpui; naming them here keeps the picker from silently
# losing them if gpui ever stops asking.
x11rb = { version = "0.13", features = ["composite", "randr", "xfixes"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
# the dependency line this app is held to is read off the manifests, not
# asserted about from memory: `the_app_links_only_what_it_still_speaks_for`
toml = "0.8"
commonware-cryptography.workspace = true
simnode = { path = "../bin/simnode" }
tempfile.workspace = true
